name: Enviar aviso al móvil
on:
  push:
    branches: [main]
    paths: ['avisos/aviso.json']
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save firebase-admin@12
      - run: node avisos/enviar.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
