<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F07800">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aula E2O">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Aula abierta de la Escuela de Segunda Oportunidad de Arrabal AID (Málaga) para preparar la prueba libre de ESO.">
<title>Aula Abierta E2O</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* Layout: app móvil — barra superior con logos, contenido en una columna y menú inferior fijo; vistas por hash */
:root{
  --bg:#E86F00; --bg2:#F28A14; --on-bg:#FFFFFF; --hero1:#16357F; --hero2:#0A7BC2; --surface:#FFFFFF; --ink:#1A1C2B; --muted:#5E6175; --line:#E3E0DB;
  --brand:#EF7D00; --brand-ink:#B35A00; --e2o:#0A7BC2; --e2o2:#22B0E6;
  --com:#2563EB; --soc:#168A4C; --cie:#D3343C; --ori:#EF7D00;
  --ok:#168A4C; --bad:#D3343C;
  --display:"Poppins", "Segoe UI", system-ui, sans-serif;
  --titulo:"Anton", "Impact", "Arial Narrow", sans-serif;
  --mano:"Reenie Beanie", "Segoe Print", cursive;
  --body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#3A1F05; --bg2:#4A2808; --on-bg:#FFF4E8; --hero1:#16357F; --hero2:#0A6AA8; --surface:#1C1E26; --ink:#F0F0F4; --muted:#A6A8B8; --line:#2F313C;
    --brand:#FF9A2E; --brand-ink:#FFB25E; --e2o:#3FA9E8; --e2o2:#6CCBF2;
    --com:#6E9BFF; --soc:#3CC77E; --cie:#FF6B70; --ori:#FF9A2E; --ok:#3CC77E; --bad:#FF6B70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#3A1F05; --bg2:#4A2808; --on-bg:#FFF4E8; --hero1:#16357F; --hero2:#0A6AA8; --surface:#1C1E26; --ink:#F0F0F4; --muted:#A6A8B8; --line:#2F313C;
  --brand:#FF9A2E; --brand-ink:#FFB25E; --e2o:#3FA9E8; --e2o2:#6CCBF2;
  --com:#6E9BFF; --soc:#3CC77E; --cie:#FF6B70; --ori:#FF9A2E; --ok:#3CC77E; --bad:#FF6B70;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--e2o);outline-offset:2px;border-radius:8px}

/* Cabecera */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.5px}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.brand strong{font-family:var(--display);font-size:18px}
.hello h1{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-1px}
.hello p{color:var(--muted);margin:8px 0 22px;max-width:46ch}

/* Tarjetas de ámbito */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.label{margin:12px 0 0;font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-height:168px;padding:16px;border-radius:20px;background:var(--c);color:#fff;text-decoration:none;overflow:hidden;transition:transform .15s ease}
.card:active{transform:scale(.98)}
.card .ico{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:auto}
.card .ico svg{width:24px;height:24px}
.card h2{font-size:21px;font-weight:800;color:#fff}
.card span{font-size:14px;opacity:.92;line-height:1.3}
.card .count{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;background:rgba(0,0,0,.18);padding:3px 9px;border-radius:99px;opacity:1}
.card.wide{min-height:104px;padding-right:96px;flex-direction:row;align-items:center;gap:14px}
.card.wide .ico{margin-bottom:0;flex:none}
.card.wide div{display:flex;flex-direction:column;gap:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{color:#11131F}:root:not([data-theme="light"]) .card h2{color:#11131F}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .card h2{color:#11131F}

.note{margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:15px}
.note b{color:var(--ink)}

/* Vista de ámbito */
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:700;font-size:15px;margin:16px 0}
.head{border-radius:22px;padding:20px 18px;background:var(--c);color:#fff;margin-bottom:18px}
.head h1{font-size:clamp(28px,7vw,38px);font-weight:800;color:inherit}
.head p{margin:6px 0 0;opacity:.95}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .head{color:#11131F}}
:root[data-theme="dark"] .head{color:#11131F}
.tabs{display:flex;gap:8px;overflow-x:auto}
.tab{flex:none;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;text-align:left;width:100%;cursor:pointer}
.item:not(.soon):active{transform:scale(.99)}
.item .t{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.item .t svg{width:22px;height:22px}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:16px;line-height:1.3}
.item .txt small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.badge{flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.item.soon{opacity:.6;cursor:default}
.item.soon .badge{background:var(--bg);color:var(--muted)}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}

/* Juego */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-weight:700;color:var(--muted);font-size:15px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s ease}
.q{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px}
.q h2{font-size:23px;font-weight:800;margin-bottom:16px}
.q .ctx{font-size:16px;color:var(--muted);margin:-8px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:17px;text-align:left;cursor:pointer;min-height:56px}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:14px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:16px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.fb.ko{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.score{text-align:center;padding:26px 18px}
.score .big{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.score p{color:var(--muted);margin:8px 0 0}
.review{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.review div{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.review b{display:block}
.review em{font-style:normal;color:var(--ok);font-weight:700}


.exam{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--ink);text-decoration:none;--c:var(--ink)}
.exam .t{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.exam .t svg{width:22px;height:22px}
.exam b{display:block}.exam small{display:block;color:var(--muted);font-size:14px}
.exam .arrow{margin-left:auto;font-weight:700;font-size:20px}
.info{padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);font-size:16px}
.tip{margin:0 0 4px;color:var(--muted);font-size:15px}
.clase{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.clase header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}
.clase header b{font-family:var(--display);font-size:18px}
.clase header span{color:var(--muted);font-size:14px}
.clase header em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.clase p{margin:6px 0 0;font-size:15px;line-height:1.45}
.clase .tag{display:inline-block;margin-right:8px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.clase.hecha>*{opacity:.55;transition:opacity .2s}
.clase.hecha:hover>*,.clase.hecha:focus-within>*{opacity:1}
.clase.hecha header em{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.clase.ahora,.clase.sig{border:2px solid var(--c)}
.clase.ahora header em,.clase.sig header em{background:var(--c);color:#fff}

.leer{display:inline-block;margin-left:6px;font-weight:700;font-size:14px;color:var(--c);text-decoration:none;white-space:nowrap}
.tema .kicker{margin:0 0 6px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.indice{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.ap,.acts{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:12px;scroll-margin-top:12px}
.ap h2,.acts h2{font-size:22px;font-weight:800;margin-bottom:10px;color:var(--c)}
.ap p,.ap li{font-size:16.5px;line-height:1.55;max-width:65ch}
.ap p{margin:0 0 10px}
.ap ul,.ap ol{padding-left:20px;margin:0 0 10px}
.ap li{margin-bottom:6px}
.ej{padding:12px 14px;border-radius:12px;background:var(--bg);text-align:center;font-size:16.5px;margin:0 0 10px;line-height:1.6}
.ojo{padding:10px 14px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:0 10px 10px 0}
.tabla{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px}
.tabla table{border-collapse:collapse;width:100%;min-width:480px;font-size:15px}
.tabla th,.tabla td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tabla tr:last-child td{border-bottom:0}
.tabla th{background:color-mix(in srgb,var(--c) 12%,var(--surface));font-size:14px}
details{margin:6px 0 4px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line));border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700;color:var(--c)}
details[open] summary{margin-bottom:8px}
details p{margin:0}
.pasos li::marker{font-weight:800;color:var(--c)}
.acts .btn svg{width:22px;height:22px}
.btn:disabled{opacity:.6}
.mini{margin:8px 0 0;color:var(--muted);font-size:14px;text-align:center}

@media (max-width:560px){
  .tabla{border:0;overflow:visible}
  .tabla table{min-width:0}
  .tabla table,.tabla tbody,.tabla tr,.tabla td{display:block;width:100%}
  .tabla tr:first-child{display:none}
  .tabla tr{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:6px 0;background:var(--surface)}
  .tabla td{border:0;padding:4px 12px}
  .tabla td[data-th]::before{content:attr(data-th);display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tabla td:first-child{font-size:16px}
}

.portada{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;border-top:8px solid var(--c)}
.portada .kicker,.cap .kicker{margin:0 0 4px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.portada h2{font-size:28px;font-weight:800}
.portada p{margin:8px 0 0}
.indice-libro{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.indice-libro h3{font-size:20px;margin-bottom:8px}
.ind-parte{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.ind-parte>b{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin-bottom:4px}
.ind-tema{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:15.5px;line-height:1.35}
.ind-tema span{flex:none;font-family:var(--display);font-weight:800;color:var(--c);min-width:22px;font-variant-numeric:tabular-nums}
.ind-tema small{margin-left:auto;flex:none;color:var(--muted);font-size:12.5px}
.parte{font-size:24px;font-weight:800;color:var(--c);margin:18px 0 0}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;scroll-margin-top:12px}
.cap>h2{font-size:25px;font-weight:800;margin-bottom:6px}
.cap-intro{color:var(--muted);margin:0 0 6px}
.cap h3{font-size:19px;font-weight:800;color:var(--c);margin:18px 0 8px}
.cap p,.cap li{font-size:16.5px;line-height:1.55}
.cap p{margin:0 0 10px}
.cap ul,.cap ol{padding-left:20px;margin:0 0 10px}
.cap .leer{display:block;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);margin-left:0}

/* App: barra superior, portada y menú inferior */
.appbar{position:sticky;top:0;z-index:20;background:#fff;color:#1A1C2B;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.appbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 16px;text-decoration:none}
.appbar::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--brand) 0 70%,var(--e2o) 70% 100%)}
.logo-slot{flex:none;height:38px;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:#fff;border-radius:10px}
.logo-slot img{height:38px;width:auto;display:block}
.logo-e2o{width:38px;background:linear-gradient(135deg,var(--e2o),var(--e2o2));font-size:15px}
.logo-arrabal{margin-left:auto;padding:0 10px;background:var(--brand);font-size:12px;letter-spacing:.02em}
.logo-slot.has-img{background:none;width:auto;padding:0}
.lg-e2o{flex:none;width:44px;height:44px;object-fit:cover;border-radius:12px}
.lg-arrabal{flex:none;margin-left:auto;height:42px;width:auto;padding:2px 0}
.creditos{margin:28px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.creditos .lgs{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;padding:6px 12px;border-radius:12px}
.creditos .lgs img:first-child{width:36px;height:36px;border-radius:8px;object-fit:cover}
.creditos .lgs img:last-child{height:30px;width:auto}
.creditos p{margin:0;color:var(--on-bg);opacity:.9;font-size:11.5px;line-height:1.4;max-width:42ch}
@media (prefers-color-scheme: dark){}

.appname{display:flex;flex-direction:column;min-width:0}
.appname b{font-family:var(--display);font-size:18px;line-height:1.1}
.appname small{color:#5E6175;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:linear-gradient(135deg,#16357F 0%,#0A6AA8 100%);box-shadow:0 -4px 16px rgba(10,40,100,.25);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:rgba(255,255,255,.78);font-size:11.5px;font-weight:700}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:#fff}
.tabbar a[aria-current="page"] .tb-ico{background:rgba(255,255,255,.22)}
.tb-ico{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}

.hero{margin:16px 0 0;padding:20px 18px 18px;border-radius:24px;background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;box-shadow:0 10px 24px rgba(10,40,100,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero p{margin:0;font-weight:700;font-size:14px;opacity:.95}
.hero h1{font-size:clamp(28px,8vw,40px);font-weight:800;letter-spacing:-.5px;margin:4px 0 8px;color:#fff}
.hero .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:99px;font-size:13.5px;font-weight:700}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.sec-t h2{font-size:20px;font-weight:800}
.sec-t span{color:var(--muted);font-size:13.5px}

.semana{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.sem{flex:none;width:min(300px,82%);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);text-decoration:none}
.sem small{color:var(--muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.sem b{font-family:var(--display);font-size:18px;line-height:1.2}
.sem .tt{font-size:15px;line-height:1.35}
.sem .tt i{font-style:normal;font-weight:700;color:var(--c)}
.sem .go{margin-top:auto;padding-top:6px;color:var(--c);font-weight:700;font-size:14.5px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-decoration:none;text-align:center}
.tile:active{transform:scale(.97)}

.row b{font-size:16px}
.row small{color:var(--muted);font-size:13.5px;line-height:1.3}
.row .chev{margin-left:auto;color:var(--muted);flex:none}
.foot-note{margin:18px 4px 0;color:var(--muted);font-size:13.5px;text-align:center}

.head{border-radius:0 0 24px 24px;margin:0 -16px 14px;padding:16px 18px 20px}
.head .back-in{display:inline-flex;align-items:center;gap:4px;color:inherit;text-decoration:none;font-weight:700;font-size:14.5px;opacity:.95;margin-bottom:10px}
.tabs{position:sticky;top:68px;z-index:10;background:var(--bg);padding:8px 16px;margin:0 -16px 6px}

/* Texto sobre el fondo naranja */
.sec-t h2,.parte,.hello h1{color:var(--on-bg)}
.sec-t span,.foot-note,.tip,.list>.mini{color:var(--on-bg);font-weight:700;opacity:.95}
.empty{background:var(--surface);color:var(--muted)}
.head{box-shadow:0 8px 20px rgba(0,0,0,.15)}

.agenda{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
.ag-nota{margin:2px 4px 10px;font-size:14.5px;color:var(--muted)}
.dias{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dia{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);background:var(--surface);cursor:pointer}
.dia small{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.dia b{font-family:var(--display);font-size:20px;line-height:1.1}
.dia i{width:6px;height:6px;border-radius:50%;margin-top:3px;background:transparent}
.dia i.si{background:var(--e2o)} .dia i.ex{background:var(--brand)}

.dia[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.dia[aria-pressed="true"] i.si{background:#fff}
.ag-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ag{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--e2o) 8%,var(--surface));border-left:4px solid var(--e2o)}

.ag.taller{border-left-color:var(--soc);background:color-mix(in srgb,var(--soc) 8%,var(--surface))}
.ag-h{flex:none;font-weight:700;font-size:14px;min-width:92px;font-variant-numeric:tabular-nums}
.ag-t{display:flex;flex-direction:column;min-width:0}
.ag-t b{font-size:15.5px;line-height:1.3}
.ag-t small{color:var(--muted);font-size:13px}
.ag-tag{margin-left:auto;flex:none;font-size:11.5px;font-weight:700;color:var(--muted)}
.ag.extra .ag-tag{color:var(--brand-ink)}
.ag-map{align-self:flex-start;white-space:nowrap;margin-top:4px;font-size:13px;font-weight:700;color:var(--brand-ink);text-decoration:none;background:rgba(255,149,0,.14);padding:3px 10px;border-radius:999px}

const TEMAS = {
'lengua-comunicacion': { ambito:'comunicacion', area:'Lengua', clase:1, titulo:'La comunicación: elementos e intención',
  intro:'Cada vez que hablas, escribes un mensaje o ves un anuncio hay comunicación. Aquí aprendes sus piezas y para qué se comunica la gente.',
  apartados:[
    {h:'1. ¿Qué es comunicar?', html:`
      <p><b>Comunicar</b> es transmitir información de una persona a otra. Nos comunicamos con palabras, pero también con gestos, imágenes, señales o sonidos.</p>
      <ul><li><b>Comunicación verbal:</b> usa palabras, de forma <b>oral</b> (una conversación, un audio) o <b>escrita</b> (un WhatsApp, una carta).</li>
      <li><b>Comunicación no verbal:</b> usa otros signos, como gestos, la expresión de la cara, una señal de tráfico o un emoji.</li></ul>
      <div class="ej">Un semáforo en rojo, un pulgar arriba o una sirena también comunican.</div>`},
    {h:'2. Los elementos de la comunicación', html:`
      <div class="tabla"><table>
        <tr><th>Elemento</th><th>Qué es</th><th>Ejemplo: un WhatsApp de Ana a Luis</th></tr>
        <tr><td><b>Emisor</b></td><td>Quien envía el mensaje</td><td>Ana</td></tr>
        <tr><td><b>Receptor</b></td><td>Quien lo recibe</td><td>Luis</td></tr>
        <tr><td><b>Mensaje</b></td><td>Lo que se dice</td><td>«Llego a las 8»</td></tr>
        <tr><td><b>Código</b></td><td>El sistema de signos que comparten</td><td>La lengua española escrita</td></tr>
        <tr><td><b>Canal</b></td><td>El medio por el que viaja el mensaje</td><td>El móvil (internet)</td></tr>
        <tr><td><b>Contexto</b></td><td>La situación que rodea al mensaje</td><td>Han quedado para cenar</td></tr>
      </table></div>
      <p class="ojo"><b>Ojo:</b> si emisor y receptor no comparten el código (por ejemplo, no hablan el mismo idioma), la comunicación falla. Lo que dificulta que llegue el mensaje se llama <b>ruido</b>: mala cobertura, un ruido de fondo, letra que no se entiende…</p>
      <details><summary>Practica: un profesor explica la lección en clase. ¿Cuál es el canal?</summary><p>El aire, porque es comunicación oral. Si escribe en la pizarra, el canal es la pizarra. El emisor es el profesor, el receptor la clase y el código, la lengua española.</p></details>`},
    {h:'3. La intención comunicativa', html:`
      <p>Siempre que nos comunicamos queremos conseguir algo. Esa finalidad es la <b>intención comunicativa</b>, y en el examen es una de las preguntas más habituales sobre un texto.</p>
      <div class="tabla"><table>
        <tr><th>Intención</th><th>Para qué</th><th>Ejemplos</th></tr>
        <tr><td><b>Informar</b></td><td>Contar hechos o datos de forma objetiva</td><td>Una noticia, el horario del autobús</td></tr>
        <tr><td><b>Expresar</b></td><td>Mostrar sentimientos u opiniones</td><td>Un diario, «¡Qué ganas tengo de verte!»</td></tr>
        <tr><td><b>Convencer o persuadir</b></td><td>Que el receptor piense o haga algo</td><td>Un anuncio, un artículo de opinión</td></tr>
        <tr><td><b>Ordenar o pedir</b></td><td>Que el receptor actúe</td><td>Unas instrucciones, «Cierra la puerta»</td></tr>
        <tr><td><b>Entretener o crear belleza</b></td><td>Divertir o emocionar con el lenguaje</td><td>Un poema, una novela, un chiste</td></tr>
      </table></div>
      <p>Estas intenciones se corresponden con las <b>funciones del lenguaje</b>: representativa o informativa (informar), expresiva (sentimientos), apelativa (convencer, ordenar), poética (crear belleza), fática (comprobar que el canal funciona: «¿Me oyes?») y metalingüística (hablar de la propia lengua: «"Casa" es un sustantivo»).</p>
      <details><summary>Practica: «Compra ya las nuevas zapatillas. ¡Solo este fin de semana!» ¿Qué intención tiene?</summary><p>Persuadir: es un anuncio que quiere que compres. Usa el imperativo (compra) y frases exclamativas, típicas de la función apelativa.</p></details>`},
    {h:'4. Cómo reconocer la intención en un texto', html:`
      <ul><li><b>Informa</b> si usa la tercera persona, datos, fechas y lenguaje neutro.</li>
      <li><b>Expresa</b> si usa la primera persona (yo, me, mi), exclamaciones y palabras de sentimiento.</li>
      <li><b>Persuade u ordena</b> si se dirige al receptor (tú, usted), usa imperativos, preguntas o promesas.</li>
      <li><b>Busca belleza</b> si juega con el lenguaje: rimas, comparaciones, metáforas.</li></ul>
      <p class="ojo"><b>En el examen:</b> no basta con decir la intención. Justifícala con una pista del texto: «Su intención es persuadir, porque usa imperativos como "compra"».</p>`}

'ingles-to-be': { ambito:'comunicacion', area:'Inglés', clase:1, titulo:'To be y presentarse',
  intro:'El verbo to be (ser / estar) es el más importante del inglés. Con él puedes presentarte y decir de dónde eres, cuántos años tienes o cómo estás.',
  apartados:[
    {h:'1. To be en afirmativa', html:`
      <p><b>To be</b> significa «ser» y también «estar». Tiene tres formas en presente: <b>am, is, are</b>.</p>
      <div class="tabla"><table>
        <tr><th>Forma completa</th><th>Contracción</th><th>Español</th></tr>
        <tr><td>I am</td><td>I'm</td><td>yo soy / estoy</td></tr>
        <tr><td>You are</td><td>You're</td><td>tú eres / estás</td></tr>
        <tr><td>He is</td><td>He's</td><td>él es / está</td></tr>
        <tr><td>She is</td><td>She's</td><td>ella es / está</td></tr>
        <tr><td>It is</td><td>It's</td><td>es / está (cosa o animal)</td></tr>
        <tr><td>We are</td><td>We're</td><td>nosotros somos / estamos</td></tr>
        <tr><td>You are</td><td>You're</td><td>vosotros sois / estáis</td></tr>
        <tr><td>They are</td><td>They're</td><td>ellos son / están</td></tr>
      </table></div>
      <p class="ojo"><b>Importante:</b> en inglés el sujeto no se puede quitar. En español decimos «Soy de Málaga», pero en inglés hay que decir <i>I'm from Málaga</i>.</p>`},
    {h:'2. Para qué se usa', html:`
      <ul><li><b>Nombre:</b> <i>I'm Laura. My name is Laura.</i></li>
      <li><b>Edad:</b> <i>I'm 20 (years old).</i> En inglés la edad se dice con <i>be</i>, no con <i>have</i>: nunca «I have 20 years».</li>
      <li><b>Origen y nacionalidad:</b> <i>I'm from Spain. I'm Spanish.</i></li>
      <li><b>Profesión:</b> <i>She's a nurse. He's a student.</i> Con profesiones se pone <i>a / an</i>.</li>
      <li><b>Cómo estás:</b> <i>I'm tired. We're happy.</i></li>
      <li><b>Dónde estás:</b> <i>They're at home.</i></li></ul>`},
    {h:'3. Presentarse', html:`
      <div class="ej" style="text-align:left">Hello! My name is Adam. I'm 19 years old. I'm from Morocco, but I live in Málaga. I'm a student at the Second Chance School. My favourite sport is football.</div>
      <p><b>Saludos útiles:</b> <i>Hello / Hi</i> (hola) · <i>Good morning</i> (buenos días) · <i>Nice to meet you</i> (encantado) · <i>How are you? — I'm fine, thanks</i> · <i>Goodbye / See you</i> (adiós / hasta luego).</p>
      <p><b>Países y nacionalidades:</b> Spain – Spanish · Morocco – Moroccan · Colombia – Colombian · Romania – Romanian · England – English · France – French. En inglés se escriben siempre con mayúscula.</p>`}
  ],
  juego:'ingles-to-be',
  ficha:{ ejercicios:[
    {e:'Complete with am, is or are.', items:['a) I ______ 22 years old.','b) She ______ from Colombia.','c) We ______ students.','d) My brother ______ a cook.','e) They ______ at home.','f) It ______ a big city.'], lineas:0,
      sol:'a) am · b) is · c) are · d) is · e) are · f) is'},
    {e:'Write the contractions.', items:['a) I am →','b) He is →','c) They are →','d) You are →'], lineas:0,
      sol:"a) I'm · b) He's · c) They're · d) You're"},
    {e:'Translate into English.', items:['a) Tengo 19 años.','b) Soy de Málaga.','c) Ella es enfermera.','d) Estamos cansados.'], lineas:4,
      sol:"a) I'm 19 (years old). · b) I'm from Málaga. · c) She's a nurse. · d) We're tired."},
    {e:'Introduce yourself (40-60 words): name, age, where you are from, where you live and something you like.', items:[], lineas:7,
      sol:"Respuesta libre. Modelo: Hello! My name is Adam. I'm 19 years old. I'm from Morocco, but I live in Málaga. I'm a student at the Second Chance School. My favourite sport is football."}
  ]}
},
'lengua-comprension': { ambito:'comunicacion', area:'Lengua', clase:2, titulo:'Comprensión lectora y resumen',
  intro:'Entender bien un texto es la base de 30 puntos del examen. Aquí aprendes a sacar el tema, las ideas, la estructura y a hacer un buen resumen.',
  apartados:[
    {h:'1. Cómo leer un texto', html:`
      <ol class="pasos"><li><b>Primera lectura</b> rápida, para saber de qué va.</li>
      <li><b>Segunda lectura</b> despacio, subrayando lo importante y buscando las palabras que no conozcas.</li>
      <li><b>Pregúntate:</b> ¿de qué habla? ¿Qué dice sobre eso? ¿Para qué lo ha escrito el autor?</li></ol>`},
    {h:'2. El tema', html:`
      <p>El <b>tema</b> es la idea central del texto resumida en una frase corta, normalmente sin verbo conjugado. Responde a: <i>¿de qué trata el texto?</i></p>
      <div class="ej">Tema: «Los beneficios del deporte para la salud mental»</div>
      <p class="ojo"><b>Ni muy general ni muy concreto.</b> «El deporte» es demasiado general; «correr 30 minutos los martes» es demasiado concreto.</p>`},
    {h:'3. Ideas principales y secundarias', html:`
      <p>Cada párrafo suele tener una <b>idea principal</b>, la más importante, sin la que el texto no se entiende. Las <b>ideas secundarias</b> la explican, dan ejemplos o detalles.</p>
      <div class="ej" style="text-align:left"><b>Principal:</b> El móvil ha cambiado nuestra forma de relacionarnos.<br><b>Secundaria:</b> Por ejemplo, ahora quedamos por WhatsApp en lugar de llamar.</div>
      <p><b>Truco:</b> si quitas una idea y el texto sigue teniendo sentido, era secundaria.</p>`},
    {h:'4. La estructura y los conectores', html:`
      <p>La mayoría de textos siguen esta estructura:</p>
      <ul><li><b>Introducción:</b> presenta el tema.</li><li><b>Desarrollo:</b> explica las ideas, con datos y ejemplos.</li><li><b>Conclusión:</b> cierra, resume u opina.</li></ul>
      <p>Si la idea principal está al principio, la estructura es <b>deductiva</b> (o analizante); si está al final, <b>inductiva</b> (o sintetizante).</p>
      <p>Los <b>conectores</b> unen las ideas y te ayudan a seguir el texto:</p>
      <div class="tabla"><table>
        <tr><th>Para…</th><th>Conectores</th></tr>
        <tr><td>Añadir</td><td>además, también, asimismo</td></tr>
        <tr><td>Oponer</td><td>pero, sin embargo, en cambio, aunque</td></tr>
        <tr><td>Explicar una causa</td><td>porque, ya que, puesto que</td></tr>
        <tr><td>Dar una consecuencia</td><td>por eso, por tanto, así que</td></tr>
        <tr><td>Ordenar</td><td>en primer lugar, después, por último</td></tr>
        <tr><td>Concluir</td><td>en resumen, en conclusión, en definitiva</td></tr>
        <tr><td>Poner ejemplos</td><td>por ejemplo, es decir, como</td></tr>
      </table></div>`},
    {h:'5. El resumen y el esquema', html:`
      <p>Un <b>resumen</b> cuenta las ideas principales del texto <b>con tus propias palabras</b>, en un solo párrafo y en mucho menos espacio (más o menos una cuarta parte).</p>
      <p><b>Reglas del resumen:</b></p>
      <ul><li>Escríbelo en tercera persona: «El autor explica que…».</li><li>No copies frases enteras del texto.</li><li>No des tu opinión.</li><li>Quita ejemplos, datos y repeticiones.</li><li>Une las ideas con conectores.</li></ul>
      <p>El <b>esquema</b> ordena las ideas de forma visual, con la principal arriba y las secundarias debajo, usando guiones, números o llaves. Ayuda a estudiar y a preparar el resumen.</p>
      <details><summary>Practica: ¿qué falla en este resumen? «Yo creo que el texto tiene razón porque el deporte es lo mejor.»</summary><p>Da una opinión y no resume las ideas del texto. Un resumen correcto sería, por ejemplo: «El texto explica que hacer deporte mejora el estado de ánimo y reduce el estrés, por lo que recomienda practicarlo con regularidad».</p></details>`}
  ],
  juego:'lengua-comprension',
  ficha:{ ejercicios:[
    {lectura:true, e:'Lee el texto y responde a las preguntas.', items:['«Cada vez más jóvenes deciden volver a estudiar después de dejar el instituto. Muchos lo hacen porque necesitan el título para encontrar un trabajo mejor. Otros, en cambio, quieren demostrarse a sí mismos que pueden conseguirlo. Por eso, las escuelas de segunda oportunidad tienen hoy más alumnado que nunca. En definitiva, nunca es tarde para retomar los estudios.»'], lineas:0, sol:''},
    {e:'¿Cuál es el tema del texto?', items:[], lineas:2, sol:'El regreso de los jóvenes a los estudios (o: por qué los jóvenes vuelven a estudiar).'},
    {e:'Escribe la idea principal y dos ideas secundarias.', items:[], lineas:4, sol:'Principal: cada vez más jóvenes vuelven a estudiar y nunca es tarde para hacerlo. Secundarias: algunos lo hacen para conseguir un trabajo mejor; otros, para demostrarse que pueden; las escuelas de segunda oportunidad tienen más alumnado.'},
    {e:'Copia tres conectores del texto y di para qué sirven.', items:[], lineas:3, sol:'«En cambio» (oposición), «por eso» (consecuencia), «en definitiva» (conclusión). También vale «porque» (causa).'},
    {e:'Escribe un resumen del texto (2-3 líneas).', items:[], lineas:4, sol:'Ejemplo: El texto explica que muchos jóvenes vuelven a estudiar, unos para mejorar su empleo y otros por superación personal, lo que hace crecer las escuelas de segunda oportunidad. Concluye que nunca es tarde para retomar los estudios.'}
  ]}
},
'ingles-pronouns-have-got': { ambito:'comunicacion', area:'Inglés', clase:2, titulo:'Pronouns, to be, have got and possessives',
  intro:'Completa el verbo to be con la negativa y las preguntas, aprende have got (tener) y los posesivos, y habla de tu familia.',
  apartados:[
    {h:'1. Subject pronouns', html:`
      <p>Los pronombres personales de sujeto son: <b>I</b> (yo), <b>you</b> (tú), <b>he</b> (él), <b>she</b> (ella), <b>it</b> (cosa o animal), <b>we</b> (nosotros/as), <b>you</b> (vosotros/as), <b>they</b> (ellos/as).</p>
      <p class="ojo"><b>I</b> se escribe siempre con mayúscula. <b>You</b> vale para tú y para vosotros. <b>They</b> sirve para personas y para cosas.</p>`},
    {h:'2. To be: negative and questions', html:`
      <div class="tabla"><table>
        <tr><th>Negativa</th><th>Pregunta</th><th>Respuesta corta</th></tr>
        <tr><td>I'm not tired.</td><td>Am I late?</td><td>Yes, you are. / No, you aren't.</td></tr>
        <tr><td>He isn't Spanish.</td><td>Is he Spanish?</td><td>Yes, he is. / No, he isn't.</td></tr>
        <tr><td>We aren't at home.</td><td>Are you at home?</td><td>Yes, we are. / No, we aren't.</td></tr>
      </table></div>
      <p>Para la <b>negativa</b> se añade <i>not</i> (isn't, aren't; con I es <i>I'm not</i>). Para la <b>pregunta</b> se pone el verbo delante del sujeto: <i>You are → Are you…?</i></p>
      <p><b>Preguntas útiles:</b> <i>What's your name? How old are you? Where are you from? How are you?</i></p>`},
    {h:'3. Have got (tener)', html:`
      <div class="tabla"><table>
        <tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
        <tr><td><b>Afirmativa</b></td><td>I've got a sister.</td><td>She's got a car.</td></tr>
        <tr><td><b>Negativa</b></td><td>I haven't got a bike.</td><td>He hasn't got a job.</td></tr>
        <tr><td><b>Pregunta</b></td><td>Have you got a pet?</td><td>Has she got a phone?</td></tr>
        <tr><td><b>Respuesta corta</b></td><td>Yes, I have. / No, I haven't.</td><td>Yes, she has. / No, she hasn't.</td></tr>
      </table></div>
      <p class="ojo"><b>Cuidado:</b> <i>she's got</i> = she <b>has</b> got (tiene), pero <i>she's tired</i> = she <b>is</b> tired (está). El contexto te dice cuál es.</p>`},
    {h:'4. Possessive adjectives', html:`
      <div class="tabla"><table>
        <tr><th>Pronombre</th><th>Posesivo</th><th>Ejemplo</th></tr>
        <tr><td>I</td><td><b>my</b> (mi)</td><td>my mother</td></tr>
        <tr><td>you</td><td><b>your</b> (tu / vuestro)</td><td>your phone</td></tr>
        <tr><td>he</td><td><b>his</b> (su, de él)</td><td>his brother</td></tr>
        <tr><td>she</td><td><b>her</b> (su, de ella)</td><td>her name</td></tr>
        <tr><td>it</td><td><b>its</b> (su, de una cosa)</td><td>its colour</td></tr>
        <tr><td>we</td><td><b>our</b> (nuestro)</td><td>our class</td></tr>
        <tr><td>they</td><td><b>their</b> (su, de ellos)</td><td>their house</td></tr>
      </table></div>
      <p>No cambian en plural: <i>my friends</i>, nunca «mys friends». Para decir «de alguien» se usa <b>'s</b>: <i>Ana's car</i> (el coche de Ana).</p>`},
    {h:'5. The family', html:`
      <p>mother / mum (madre) · father / dad (padre) · parents (padres) · brother (hermano) · sister (hermana) · son (hijo) · daughter (hija) · grandmother (abuela) · grandfather (abuelo) · uncle (tío) · aunt (tía) · cousin (primo/a) · husband (marido) · wife (mujer) · boyfriend / girlfriend (novio / novia).</p>
      <div class="ej" style="text-align:left">I've got a big family. My mother's name is Rocío and my father's name is Antonio. I've got two brothers and a sister. My sister's got a son, so I'm an uncle!</div>`}
  ],
  juego:'ingles-pronouns-have-got',
  ficha:{ ejercicios:[
    {e:'Make the sentences negative.', items:["a) I'm from France.",'b) She is at work.',"c) They're my cousins.","d) We've got a car."], lineas:4,
      sol:"a) I'm not from France. · b) She isn't at work. · c) They aren't my cousins. · d) We haven't got a car."},
    {e:'Complete with have got or has got.', items:['a) My sister ______ two children.','b) I ______ a new phone.','c) Juan ______ a dog.','d) We ______ an English class on Monday.'], lineas:0,
      sol:'a) has got · b) have got · c) has got · d) have got'},
    {e:'Complete with a possessive: my, your, his, her, our, their.', items:['a) He is Carlos. ______ mother is a teacher.','b) She is Lucía. ______ brother is 15.','c) We live in Málaga. ______ flat is small.','d) They are from Peru. ______ city is Lima.'], lineas:0,
      sol:'a) His · b) Her · c) Our · d) Their'},
    {e:'Write about your family (40-60 words). Use have got and possessives.', items:[], lineas:7,
      sol:"Respuesta libre. Modelo: I've got a big family. My mother's name is Rocío and my father's name is Antonio. I've got two brothers and a sister. My sister's got a son, so I'm an uncle!"}
  ]}
},
'lengua-palabras-1': { ambito:'comunicacion', area:'Lengua', clase:3, titulo:'Clases de palabras I: sustantivo, adjetivo y determinante',
  intro:'Las palabras se agrupan en clases según cómo funcionan. Empezamos por las tres que forman el grupo del nombre: «esos dos coches rojos».',
  apartados:[
    {h:'1. El sustantivo', html:`
      <p>El <b>sustantivo</b> (o nombre) es la palabra que nombra personas, animales, cosas, lugares, sentimientos o ideas: <i>Ana, perro, mesa, Málaga, alegría</i>.</p>
      <div class="tabla"><table>
        <tr><th>Clase</th><th>Qué nombra</th><th>Ejemplos</th></tr>
        <tr><td><b>Común / propio</b></td><td>Cualquier ser de un tipo / un ser concreto (con mayúscula)</td><td>ciudad, chico / Málaga, Laura</td></tr>
        <tr><td><b>Concreto / abstracto</b></td><td>Se percibe con los sentidos / ideas o sentimientos</td><td>mesa, pan / amor, libertad, miedo</td></tr>
        <tr><td><b>Individual / colectivo</b></td><td>Un solo ser / un grupo en singular</td><td>árbol, oveja / bosque, rebaño, equipo</td></tr>
        <tr><td><b>Contable / incontable</b></td><td>Se puede contar / no se puede contar</td><td>silla, libro / agua, arena, dinero</td></tr>
      </table></div>
      <p>El sustantivo tiene <b>género</b> (masculino o femenino: <i>el niño / la niña</i>) y <b>número</b> (singular o plural: <i>casa / casas</i>). El plural se forma con <i>-s</i> (mesa → mesas) o <i>-es</i> (papel → papeles); las palabras acabadas en <i>-z</i> cambian a <i>-ces</i> (lápiz → lápices).</p>`},
    {h:'2. El adjetivo', html:`
      <p>El <b>adjetivo</b> dice cómo es el sustantivo, una cualidad o característica: <i>casa <b>grande</b>, chica <b>simpática</b></i>.</p>
      <ul><li><b>Concuerda</b> con el sustantivo en género y número: <i>coche rojo, motos rojas</i>.</li>
      <li>Puede ir <b>detrás</b> (lo normal: <i>un día largo</i>) o <b>delante</b> (<i>un largo día</i>).</li>
      <li>Algunos tienen una sola forma para los dos géneros: <i>feliz, joven, verde, fácil</i>.</li></ul>
      <p><b>Grados del adjetivo:</b></p>
      <div class="tabla"><table>
        <tr><th>Grado</th><th>Ejemplo</th></tr>
        <tr><td><b>Positivo</b></td><td>Málaga es bonita.</td></tr>
        <tr><td><b>Comparativo</b> (más… que, menos… que, tan… como)</td><td>Málaga es más bonita que mi pueblo.</td></tr>
        <tr><td><b>Superlativo</b> (muy…, -ísimo, el más…)</td><td>Málaga es bonitísima. Es la más bonita.</td></tr>
      </table></div>
      <p class="ojo">Algunos tienen comparativos especiales: bueno → <b>mejor</b>, malo → <b>peor</b>, grande → <b>mayor</b>, pequeño → <b>menor</b>.</p>`},
    {h:'3. El determinante', html:`
      <p>El <b>determinante</b> va <b>delante del sustantivo</b> y lo concreta: dice si es conocido, a quién pertenece, cuántos hay o dónde está.</p>
      <div class="tabla"><table>
        <tr><th>Tipo</th><th>Formas</th><th>Ejemplo</th></tr>
        <tr><td><b>Artículo determinado</b></td><td>el, la, los, las</td><td>el coche (uno conocido)</td></tr>
        <tr><td><b>Artículo indeterminado</b></td><td>un, una, unos, unas</td><td>un coche (cualquiera)</td></tr>
        <tr><td><b>Demostrativo</b></td><td>este, ese, aquel (y femeninos y plurales)</td><td>esa casa, aquellos chicos</td></tr>
        <tr><td><b>Posesivo</b></td><td>mi, tu, su, nuestro, vuestro…</td><td>mi madre, vuestra clase</td></tr>
        <tr><td><b>Numeral</b></td><td>cardinales (uno, dos…) y ordinales (primero, segundo…)</td><td>tres libros, el primer día</td></tr>
        <tr><td><b>Indefinido</b></td><td>algún, ningún, mucho, poco, varios, otro, cada…</td><td>muchas personas, algún día</td></tr>
        <tr><td><b>Interrogativo y exclamativo</b></td><td>qué, cuánto, cuál</td><td>¿Qué película? ¡Cuánta gente!</td></tr>
      </table></div>
      <p class="ojo"><b>¿Determinante o pronombre?</b> Si acompaña a un sustantivo es determinante (<i><b>Este</b> móvil es mío</i>). Si va solo, sustituyéndolo, es pronombre (<i>Quiero <b>este</b></i>).</p>
      <details><summary>Practica: analiza «Mis dos hermanos mayores»</summary><p>Mis: determinante posesivo. Dos: determinante numeral. Hermanos: sustantivo común, concreto, masculino plural. Mayores: adjetivo en grado comparativo.</p></details>`}
  ],
  juego:'lengua-palabras-1',
  ficha:{ ejercicios:[
    {e:'Subraya los sustantivos y di si son comunes o propios.', items:['Laura vive en Málaga con su perro y trabaja en una tienda del centro.'], lineas:2,
      sol:'Laura (propio), Málaga (propio), perro (común), tienda (común), centro (común).'},
    {e:'Clasifica: ¿concreto o abstracto? ¿Individual o colectivo?', items:['amistad','enjambre','silla','miedo','familia','coche'], lineas:3,
      sol:'Abstractos: amistad, miedo. Concretos: enjambre, silla, familia, coche. Colectivos: enjambre, familia. Individuales: silla, coche.'},
    {e:'Escribe un adjetivo para cada sustantivo, cuidando la concordancia.', items:['a) unas zapatillas ______','b) un trabajo ______','c) la ciudad ______','d) los vecinos ______'], lineas:0,
      sol:'Respuesta libre con concordancia. Ejemplo: a) nuevas · b) duro · c) tranquila · d) amables.'},
    {e:'Escribe el comparativo y el superlativo.', items:['a) alto','b) bueno','c) rápido'], lineas:3,
      sol:'a) más alto que / altísimo · b) mejor que / buenísimo (o el mejor) · c) más rápido que / rapidísimo.'},
    {e:'Rodea los determinantes y di de qué tipo son.', items:['«Esta tarde mis tres amigos van a una fiesta con algunos compañeros.»'], lineas:2,
      sol:'Esta (demostrativo), mis (posesivo), tres (numeral), una (artículo indeterminado), algunos (indefinido).'}
  ]}
},
'ingles-present-simple': { ambito:'comunicacion', area:'Inglés', clase:4, titulo:'Present simple, routines and frequency',
  intro:'El present simple sirve para hablar de lo que haces normalmente: tus rutinas, tus costumbres y lo que siempre es verdad.',
  apartados:[
    {h:'1. Cuándo se usa', html:`
      <ul><li><b>Rutinas y costumbres:</b> <i>I get up at 7. She works on Saturdays.</i></li>
      <li><b>Hechos y verdades generales:</b> <i>Water boils at 100 degrees.</i></li>
      <li><b>Gustos y estados:</b> <i>I like rap. He lives in Málaga.</i></li></ul>`},
    {h:'2. Affirmative: la -s de he, she, it', html:`
      <p>Se usa el verbo tal cual (<i>I work, you play, we live</i>), pero con <b>he, she, it</b> se añade <b>-s</b>: <i>She work<b>s</b>. He play<b>s</b>.</i></p>
      <div class="tabla"><table>
        <tr><th>Si el verbo acaba en…</th><th>Se añade</th><th>Ejemplos</th></tr>
        <tr><td>la mayoría</td><td>-s</td><td>work → works, eat → eats</td></tr>
        <tr><td>-s, -sh, -ch, -x, -o</td><td>-es</td><td>watch → watches, go → goes, do → does</td></tr>
        <tr><td>consonante + y</td><td>-ies</td><td>study → studies, cry → cries</td></tr>
        <tr><td>vocal + y</td><td>-s</td><td>play → plays</td></tr>
      </table></div>
      <p class="ojo"><b>Irregular:</b> have → <b>has</b> (<i>She has breakfast at 8</i>).</p>`},
    {h:'3. Negative and questions: do / does', html:`
      <div class="tabla"><table>
        <tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
        <tr><td><b>Negativa</b></td><td>I <b>don't</b> work.</td><td>She <b>doesn't</b> work.</td></tr>
        <tr><td><b>Pregunta</b></td><td><b>Do</b> you work?</td><td><b>Does</b> she work?</td></tr>
        <tr><td><b>Respuesta corta</b></td><td>Yes, I do. / No, I don't.</td><td>Yes, she does. / No, she doesn't.</td></tr>
      </table></div>
      <p class="ojo"><b>Error típico:</b> con <i>doesn't</i> y <i>does</i> el verbo pierde la -s: <i>She doesn't <b>work</b></i>, nunca «doesn't works».</p>
      <p>Preguntas con partícula: <i><b>What</b> time do you get up? <b>Where</b> does he live?</i></p>`},
    {h:'4. Adverbs of frequency', html:`
      <p><b>always</b> (siempre, 100 %) · <b>usually</b> (normalmente) · <b>often</b> (a menudo) · <b>sometimes</b> (a veces) · <b>never</b> (nunca, 0 %).</p>
      <ul><li>Van <b>delante del verbo</b> principal: <i>I <b>usually</b> get up at 8.</i></li>
      <li>Van <b>detrás de to be</b>: <i>She is <b>always</b> late.</i></li></ul>
      <p>Otras expresiones van al final: <i>every day, once a week, on Mondays, at the weekend</i>.</p>`},
    {h:'5. Routines, days and time', html:`
      <p><b>Routines:</b> get up (levantarse) · have a shower (ducharse) · have breakfast / lunch / dinner (desayunar / almorzar / cenar) · go to work / school · go home · do homework · go to bed.</p>
      <p><b>Days:</b> Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday (siempre con mayúscula y con <i>on</i>: <i>on Monday</i>).</p>
      <p><b>The time:</b> <i>What time is it? — It's eight o'clock</i> (8:00) · <i>half past eight</i> (8:30) · <i>quarter past eight</i> (8:15) · <i>quarter to nine</i> (8:45). Para la hora de algo se usa <i>at</i>: <i>at 7 o'clock</i>.</p>
      <div class="ej" style="text-align:left">Karim gets up at 7 o'clock. He has breakfast and goes to school by bus. He studies in the morning and he sometimes plays football in the afternoon. He never goes to bed late on weekdays.</div>`}
  ],

'social-mapas': { ambito:'social', area:'Geografía', clase:1, titulo:'La Tierra y los mapas',
  intro:'Para estudiar Geografía hay que saber situarse: cómo se mueve la Tierra, cómo se localiza cualquier punto y cómo se leen los mapas.',
  apartados:[
    {h:'1. La Tierra y sus movimientos', html:`
      <p>La Tierra es un planeta casi esférico, un poco achatado por los polos, que gira alrededor del Sol. Tiene dos movimientos:</p>
      <div class="tabla"><table>
        <tr><th>Movimiento</th><th>Qué es</th><th>Cuánto dura</th><th>Consecuencia</th></tr>
        <tr><td><b>Rotación</b></td><td>Gira sobre sí misma</td><td>24 horas</td><td>El día y la noche</td></tr>
        <tr><td><b>Traslación</b></td><td>Da una vuelta alrededor del Sol</td><td>365 días y 6 horas (por eso cada 4 años hay un año bisiesto)</td><td>Las estaciones del año, porque el eje de la Tierra está inclinado</td></tr>
      </table></div>`},
    {h:'2. Paralelos y meridianos', html:`
      <p>Para localizar lugares, la Tierra se divide con líneas imaginarias:</p>
      <ul><li><b>Paralelos:</b> círculos horizontales, paralelos al <b>Ecuador</b>, que divide la Tierra en hemisferio norte y hemisferio sur. Los más importantes son el Trópico de Cáncer (norte), el Trópico de Capricornio (sur) y los círculos polares Ártico y Antártico.</li>
      <li><b>Meridianos:</b> semicírculos que van de polo a polo. El principal es el <b>meridiano de Greenwich</b> (meridiano 0), que pasa por Londres y divide la Tierra en hemisferio este y hemisferio oeste. Pasa también por el este de España.</li></ul>`},
    {h:'3. Latitud y longitud: las coordenadas', html:`
      <p>Cualquier punto de la Tierra se localiza con dos datos, sus <b>coordenadas geográficas</b>, que se miden en grados (°):</p>
      <div class="tabla"><table>
        <tr><th></th><th>Latitud</th><th>Longitud</th></tr>
        <tr><td><b>Qué mide</b></td><td>La distancia al Ecuador</td><td>La distancia al meridiano de Greenwich</td></tr>
        <tr><td><b>Se mide con</b></td><td>Los paralelos</td><td>Los meridianos</td></tr>
        <tr><td><b>Valores</b></td><td>De 0° a 90°, norte (N) o sur (S)</td><td>De 0° a 180°, este (E) u oeste (O)</td></tr>
      </table></div>
      <div class="ej">Málaga está aproximadamente en <b>36° N, 4° O</b>: al norte del Ecuador y al oeste de Greenwich.</div>
      <p class="ojo"><b>Truco:</b> la latitud siempre se dice primero. Piensa en una escalera: sube y baja (latitud), y luego te mueves a los lados (longitud).</p>`},
    {h:'4. Los mapas y la escala', html:`
      <p>Un <b>mapa</b> es una representación reducida y plana de la Tierra o de una parte. Como la Tierra es esférica, todos los mapas deforman algo.</p>
      <ul><li><b>Mapa físico:</b> muestra el relieve, los ríos, mares y costas, con colores según la altura (verdes las zonas bajas, marrones las altas).</li>
      <li><b>Mapa político:</b> muestra países, comunidades, provincias, fronteras y ciudades.</li>
      <li><b>Mapa temático:</b> muestra un solo tema: clima, población, carreteras, votos…</li></ul>
      <p>La <b>escala</b> indica cuántas veces se ha reducido la realidad. Puede ser:</p>
      <ul><li><b>Numérica:</b> 1:100.000 significa que 1 cm del mapa equivale a 100.000 cm reales, es decir, a <b>1 km</b>.</li>
      <li><b>Gráfica:</b> una barra dividida en tramos que indica la distancia real de cada tramo.</li></ul>
      <p>La <b>leyenda</b> explica qué significa cada color o símbolo del mapa.</p>
      <details><summary>Practica: en un mapa 1:50.000, dos pueblos están a 4 cm. ¿Cuántos km hay en la realidad?</summary><p>4 × 50.000 = 200.000 cm = 2.000 m = <b>2 km</b>.</p></details>`},
    {h:'5. Los husos horarios', html:`
      <p>Como la Tierra gira, no es la misma hora en todo el mundo. Se divide en <b>24 husos horarios</b>, uno por cada hora del día, cada uno de 15° de longitud (360° ÷ 24 = 15°).</p>
      <ul><li>Si viajas hacia el <b>este</b>, sumas horas; hacia el <b>oeste</b>, restas.</li>
      <li>La España peninsular usa la hora de Europa central (una hora más que Greenwich en invierno). Canarias tiene una hora menos que la península.</li></ul>
      <div class="ej">Si en Málaga son las 12:00, en Canarias son las 11:00.</div>`}
  ],
  juego:'social-mapas',
  ficha:{ ejercicios:[
    {e:'Une cada movimiento de la Tierra con su consecuencia.', items:['Rotación','Traslación','→ las estaciones del año','→ el día y la noche'], lineas:2,
      sol:'Rotación → el día y la noche. Traslación → las estaciones del año.'},
    {e:'Completa.', items:['a) El paralelo principal es el ______ y divide la Tierra en hemisferio ______ y ______.','b) El meridiano 0 se llama de ______.','c) La latitud se mide de 0° a ______ y la longitud de 0° a ______.'], lineas:0,
      sol:'a) Ecuador, norte y sur · b) Greenwich · c) 90°, 180°'},
    {e:'Escala: calcula la distancia real.', items:['a) Mapa 1:100.000, distancia en el mapa 5 cm.','b) Mapa 1:200.000, distancia en el mapa 3 cm.'], lineas:3,
      sol:'a) 5 × 100.000 = 500.000 cm = 5 km · b) 3 × 200.000 = 600.000 cm = 6 km.'},
    {e:'¿Qué tipo de mapa usarías para…?', items:['a) ver dónde están Sierra Nevada y el río Guadalquivir','b) ver las provincias de Andalucía','c) ver dónde llueve más en España'], lineas:0,
      sol:'a) Físico · b) Político · c) Temático (de clima o precipitaciones).'},
    {e:'Husos horarios: si en Málaga son las 18:00, ¿qué hora es en Canarias? ¿Y en un lugar dos husos al este de Málaga?', items:[], lineas:2,
      sol:'En Canarias, las 17:00. Dos husos al este, las 20:00.'}
  ]}
},
'social-relieve': { ambito:'social', area:'Geografía', clase:2, titulo:'El relieve y los ríos',
  intro:'El relieve son las formas del terreno: montañas, llanuras, costas. Aquí lo verás en el mundo, en España y en Andalucía, junto con sus ríos.',
  apartados:[
    {h:'1. Las formas del relieve', html:`
      <div class="tabla"><table>
        <tr><th>Interior</th><th>Costa</th></tr>
        <tr><td><b>Montaña:</b> elevación del terreno. Varias juntas forman una <b>sierra</b> o <b>cordillera</b>.</td><td><b>Cabo:</b> tierra que entra en el mar.</td></tr>
        <tr><td><b>Meseta:</b> llanura elevada.</td><td><b>Golfo:</b> mar que entra en la tierra (si es pequeño, <b>bahía</b>).</td></tr>
        <tr><td><b>Llanura:</b> terreno llano y bajo.</td><td><b>Península:</b> tierra rodeada de agua menos por un lado.</td></tr>
        <tr><td><b>Depresión:</b> zona más baja que lo que la rodea.</td><td><b>Isla:</b> tierra rodeada de agua por todas partes.</td></tr>
        <tr><td><b>Valle:</b> terreno entre montañas por donde suele pasar un río.</td><td><b>Playa</b> (costa baja de arena) y <b>acantilado</b> (costa alta y rocosa).</td></tr>
      </table></div>`},
    {h:'2. El relieve del mundo', html:`
      <p>Hay seis continentes: Asia (el más grande), América, África, Antártida, Europa y Oceanía. Y cinco océanos: Pacífico (el mayor), Atlántico, Índico, Glacial Ártico y Glacial Antártico.</p>
      <p><b>Grandes cordilleras:</b> el Himalaya, en Asia, con el Everest (unos 8.849 m), la montaña más alta del mundo; los Andes y las Rocosas, en América; los Alpes, en Europa.</p>
      <p><b>Grandes ríos:</b> el Nilo (África) y el Amazonas (América, el más caudaloso del mundo). En Europa destacan el Volga y el Danubio.</p>`},
    {h:'3. El relieve de España', html:`
      <p>El centro de la península es una gran <b>meseta</b> rodeada de montañas.</p>
      <ul><li><b>La Meseta Central</b>, dividida en dos por el <b>Sistema Central</b>. Dentro están también los <b>Montes de Toledo</b>.</li>
      <li><b>Montañas que rodean la Meseta:</b> la Cordillera Cantábrica (norte), el Sistema Ibérico (este) y <b>Sierra Morena</b> (sur).</li>
      <li><b>Montañas exteriores:</b> los Pirineos (frontera con Francia), las Cordilleras Costero-Catalanas y los <b>Sistemas Béticos</b>, en Andalucía.</li>
      <li><b>Depresiones:</b> la del <b>Ebro</b> (noreste) y la del <b>Guadalquivir</b> (Andalucía).</li></ul>
      <p class="ojo">El pico más alto de España es el <b>Teide</b> (3.715 m), en Tenerife. El más alto de la península es el <b>Mulhacén</b> (3.479 m), en Sierra Nevada (Granada).</p>`},
    {h:'4. Los ríos de España', html:`
      <p>Los ríos de España desembocan en tres <b>vertientes</b>:</p>
      <div class="tabla"><table>
        <tr><th>Vertiente</th><th>Cómo son sus ríos</th><th>Ríos principales</th></tr>
        <tr><td><b>Cantábrica</b></td><td>Cortos y caudalosos, porque nacen cerca del mar y allí llueve mucho</td><td>Nervión, Nalón, Bidasoa</td></tr>
        <tr><td><b>Atlántica</b></td><td>Largos, con muchos afluentes; la mayoría nacen en el centro</td><td>Miño, Duero, <b>Tajo</b> (el más largo de la península), Guadiana, <b>Guadalquivir</b></td></tr>
        <tr><td><b>Mediterránea</b></td><td>Cortos e irregulares, con poco caudal en verano; excepto el Ebro</td><td><b>Ebro</b> (el más caudaloso), Júcar, Segura</td></tr>
      </table></div>`},
    {h:'5. Andalucía y Málaga', html:`
      <p>Andalucía tiene tres grandes unidades de relieve, de norte a sur:</p>
      <ol class="pasos"><li><b>Sierra Morena</b>, al norte, que la separa de la Meseta.</li>
      <li><b>La Depresión o Valle del Guadalquivir</b>, en el centro: tierras llanas y fértiles donde están Córdoba y Sevilla.</li>
      <li><b>Los Sistemas Béticos</b>, al sur y este, con Sierra Nevada.</li></ol>
      <p>El <b>Guadalquivir</b> es el gran río andaluz: nace en Jaén, pasa por Córdoba y Sevilla y desemboca en el Atlántico en Sanlúcar de Barrameda. Es navegable hasta Sevilla. Su principal afluente es el <b>Genil</b>.</p>
      <p>En <b>Málaga</b> destacan la Serranía de Ronda y los Montes de Málaga, y los ríos <b>Guadalhorce</b> y Guadalmedina, que desembocan en el Mediterráneo.</p>`}
  ],
  juego:'social-relieve',
  ficha:{ ejercicios:[
    {e:'Define con tus palabras.', items:['a) Meseta','b) Golfo','c) Península','d) Depresión'], lineas:4,
      sol:'a) Llanura elevada. · b) Parte del mar que entra en la tierra. · c) Tierra rodeada de agua menos por un lado. · d) Zona más baja que el terreno que la rodea.'},
    {e:'Completa.', items:['a) La montaña más alta del mundo es el ______.','b) El pico más alto de España es el ______ y el de la península, el ______.','c) La Meseta está dividida por el Sistema ______.'], lineas:0,
      sol:'a) Everest · b) Teide, Mulhacén · c) Central'},
    {e:'Escribe a qué vertiente pertenece cada río.', items:['Tajo','Ebro','Guadalquivir','Nalón','Segura','Duero'], lineas:3,
      sol:'Atlántica: Tajo, Guadalquivir, Duero. Mediterránea: Ebro, Segura. Cantábrica: Nalón.'},
    {e:'Ordena de norte a sur las tres unidades del relieve andaluz y di una ciudad que esté en el valle del Guadalquivir.', items:[], lineas:3,

    {e:'¿Por qué los ríos cantábricos son cortos y caudalosos?', items:[], lineas:3,
      sol:'Porque nacen en montañas muy cerca del mar (recorrido corto) y en el norte llueve mucho todo el año (mucho caudal).'}
  ]}
},
'social-clima': { ambito:'social', area:'Geografía', clase:3, titulo:'El clima, los paisajes y el medio ambiente',
  intro:'Aprende la diferencia entre tiempo y clima, a leer un climograma, los climas de España y los grandes problemas ambientales.',
  apartados:[
    {h:'1. Tiempo y clima', html:`
      <p>El <b>tiempo atmosférico</b> es el estado de la atmósfera en un lugar y un momento concretos: <i>hoy llueve en Málaga</i>. El <b>clima</b> es el tiempo habitual de un lugar a lo largo de muchos años (al menos 30): <i>en Málaga los veranos son calurosos y secos</i>.</p>
      <p><b>Elementos del clima:</b> temperatura, precipitaciones (lluvia, nieve, granizo), presión atmosférica, viento y humedad.</p>
      <p><b>Factores que lo modifican:</b></p>
      <ul><li><b>Latitud:</b> cuanto más lejos del Ecuador, más frío.</li>
      <li><b>Altitud:</b> la temperatura baja unos 6 °C cada 1.000 m de altura.</li>
      <li><b>Distancia al mar:</b> el mar suaviza las temperaturas; en el interior hay más diferencia entre verano e invierno.</li>
      <li><b>Relieve:</b> las montañas frenan las nubes y hacen que llueva más en una ladera que en la otra.</li></ul>`},
    {h:'2. Cómo leer un climograma', html:`
      <p>Un <b>climograma</b> es un gráfico que resume el clima de un lugar a lo largo del año:</p>
      <ul><li>Las <b>barras</b> son las precipitaciones de cada mes, en milímetros (mm), y se leen en el eje de la derecha o en el que indique «mm».</li>
      <li>La <b>línea</b> es la temperatura media de cada mes, en grados (°C).</li></ul>
      <p><b>Pasos para comentarlo:</b></p>
      <ol class="pasos"><li>Busca el mes más cálido y el más frío. La diferencia entre los dos es la <b>amplitud térmica</b>.</li>
      <li>Mira cuándo llueve más y cuándo menos. Suma la precipitación anual si te la piden.</li>
      <li>Busca los <b>meses secos</b>: aquellos en que la barra de lluvia queda por debajo de la línea de temperatura (cuando los mm son menos del doble de los °C).</li>
      <li>Con todo eso, di qué clima es.</li></ol>
      <p class="ojo">Si la amplitud térmica es pequeña, el lugar está cerca del mar. Si es grande, está en el interior.</p>`},
    {h:'3. Las zonas climáticas y los climas de España', html:`
      <p>En el mundo hay tres grandes zonas: la <b>cálida</b> (entre los trópicos), las <b>templadas</b> (entre los trópicos y los círculos polares) y las <b>frías</b> (cerca de los polos). España está en la zona templada.</p>
      <div class="tabla"><table>
        <tr><th>Clima</th><th>Dónde</th><th>Cómo es</th></tr>
        <tr><td><b>Oceánico</b></td><td>Norte (Galicia, Cantábrico)</td><td>Lluvias todo el año; temperaturas suaves</td></tr>
        <tr><td><b>Mediterráneo costero</b></td><td>Costa mediterránea, sur (Málaga)</td><td>Veranos calurosos y secos, inviernos suaves; lluvias en otoño y primavera</td></tr>
        <tr><td><b>Mediterráneo de interior</b></td><td>Meseta, interior de Andalucía</td><td>Inviernos fríos y veranos muy calurosos; mucha amplitud térmica</td></tr>
        <tr><td><b>Árido o seco</b></td><td>Sureste (Almería, Murcia)</td><td>Muy pocas lluvias</td></tr>
        <tr><td><b>De montaña</b></td><td>Pirineos, Sierra Nevada…</td><td>Frío, con nieve en invierno y más lluvias</td></tr>
        <tr><td><b>Subtropical</b></td><td>Canarias</td><td>Temperaturas cálidas todo el año, pocas lluvias</td></tr>
      </table></div>`},
    {h:'4. Los paisajes', html:`
      <p>El clima decide la vegetación de cada lugar:</p>
      <ul><li><b>Paisaje oceánico:</b> bosques de hayas y robles (árboles de hoja caduca), prados verdes.</li>
      <li><b>Paisaje mediterráneo:</b> encinas, alcornoques y pinos (hoja perenne, resistentes a la sequía). Si el bosque se degrada aparece el <b>matorral</b>: jara, romero, tomillo.</li>
      <li><b>Paisaje de montaña:</b> la vegetación cambia con la altura; arriba solo hay pastos y rocas.</li>
      <li><b>Paisaje árido:</b> plantas adaptadas a la falta de agua, como el esparto o las chumberas.</li></ul>`},
    {h:'5. Problemas ambientales y desarrollo sostenible', html:`
      <ul><li><b>Cambio climático:</b> la Tierra se calienta por los gases que se emiten al quemar petróleo, carbón y gas. Provoca más sequías, olas de calor y subida del nivel del mar.</li>
      <li><b>Contaminación</b> del aire, del agua y del suelo.</li>
      <li><b>Deforestación:</b> la tala y los incendios destruyen bosques.</li>
      <li><b>Desertificación:</b> el suelo pierde fertilidad. El sureste de España es una de las zonas más afectadas de Europa.</li>
      <li><b>Escasez de agua</b> y exceso de residuos.</li></ul>
      <p>El <b>desarrollo sostenible</b> busca cubrir nuestras necesidades sin poner en peligro las de las generaciones futuras: energías renovables (sol, viento), ahorro de agua, transporte público y la regla de las tres R: <b>reducir, reutilizar y reciclar</b>.</p>`}
  ],
  juego:'social-clima',
  ficha:{ ejercicios:[
    {e:'¿Tiempo o clima? Escribe T o C.', items:['a) Mañana lloverá en Ronda.','b) En Almería llueve muy poco.','c) Hoy hace 30 °C.','d) Los inviernos en Burgos son fríos.'], lineas:0,
      sol:'a) T · b) C · c) T · d) C'},
    {e:'Explica cómo influyen la altitud y la distancia al mar en la temperatura.', items:[], lineas:4,
      sol:'A más altitud, más frío (unos 6 °C menos cada 1.000 m). Cerca del mar las temperaturas son más suaves; en el interior hay más diferencia entre verano e invierno.'},
    {e:'Lee estos datos de un climograma y responde.', items:['Mes más cálido: julio, 26 °C. Mes más frío: enero, 12 °C. Lluvias: casi todas entre octubre y abril; julio y agosto casi 0 mm.','a) ¿Cuál es la amplitud térmica?','b) ¿Qué estación es seca?','c) ¿Qué clima es?'], lineas:3,
      sol:'a) 26 − 12 = 14 °C · b) El verano · c) Mediterráneo costero (como el de Málaga).'},
    {e:'Une cada clima con un lugar.', items:['Oceánico','Árido','Subtropical','De montaña','→ Canarias','→ Sierra Nevada','→ Galicia','→ Almería'], lineas:2,
      sol:'Oceánico → Galicia · Árido → Almería · Subtropical → Canarias · De montaña → Sierra Nevada.'},
    {e:'Escribe un problema ambiental y dos acciones de desarrollo sostenible para frenarlo.', items:[], lineas:4,
      sol:'Respuesta libre. Ejemplo: el cambio climático; usar transporte público y energías renovables.'}
  ]}
},
'social-poblacion': { ambito:'social', area:'Geografía', clase:4, titulo:'La población',
  intro:'Cuánta gente vive en un lugar, cómo se reparte, cuántos nacen y mueren, y qué nos dice una pirámide de población.',
  apartados:[
    {h:'1. Conceptos básicos', html:`
      <div class="tabla"><table>
        <tr><th>Concepto</th><th>Qué es</th></tr>
        <tr><td><b>Población absoluta</b></td><td>El número total de habitantes de un lugar.</td></tr>
        <tr><td><b>Densidad de población</b></td><td>Habitantes por km². Se calcula: habitantes ÷ superficie (km²).</td></tr>
        <tr><td><b>Natalidad</b></td><td>Número de nacimientos en un año. La tasa se da por cada 1.000 habitantes (‰).</td></tr>
        <tr><td><b>Mortalidad</b></td><td>Número de fallecimientos en un año, también en ‰.</td></tr>
        <tr><td><b>Crecimiento natural o vegetativo</b></td><td>Nacimientos − defunciones.</td></tr>
        <tr><td><b>Saldo migratorio</b></td><td>Inmigrantes (los que llegan) − emigrantes (los que se van).</td></tr>
        <tr><td><b>Crecimiento real</b></td><td>Crecimiento natural + saldo migratorio.</td></tr>
        <tr><td><b>Esperanza de vida</b></td><td>Años que se espera que viva de media una persona al nacer.</td></tr>
      </table></div>
      <details><summary>Practica: un pueblo tiene 5.000 habitantes y 25 km². ¿Cuál es su densidad?</summary><p>5.000 ÷ 25 = <b>200 hab/km²</b>.</p></details>`},
    {h:'2. La distribución de la población', html:`
      <p>La población no se reparte por igual. Hay más gente donde el clima es suave, hay agua, llanuras y trabajo: <b>costas, valles y grandes ciudades</b>. Hay poca en desiertos, zonas muy frías y montañas.</p>
      <p>En <b>España</b> viven más de 48 millones de personas. Se concentran en Madrid y en la costa, mientras gran parte del interior está muy despoblado (lo que se llama la «España vaciada»). <b>Andalucía es la comunidad autónoma con más habitantes</b>.</p>`},
    {h:'3. La pirámide de población', html:`
      <p>Una <b>pirámide de población</b> es un gráfico de barras horizontales que muestra cuántos hombres (a la izquierda) y mujeres (a la derecha) hay en cada grupo de edad (abajo los jóvenes, arriba los mayores).</p>
      <div class="tabla"><table>
        <tr><th>Tipo</th><th>Forma</th><th>Qué indica</th></tr>
        <tr><td><b>Progresiva o joven</b></td><td>Base ancha y cima estrecha (triángulo)</td><td>Mucha natalidad y mortalidad alta; población joven. Típica de países en desarrollo.</td></tr>
        <tr><td><b>Regresiva o envejecida</b></td><td>Base estrecha y centro y cima anchos</td><td>Poca natalidad y esperanza de vida alta; población envejecida. Es la de España.</td></tr>
        <tr><td><b>Estancada</b></td><td>Forma de campana o columna</td><td>Natalidad y mortalidad bajas y parecidas; la población casi no cambia.</td></tr>
      </table></div>`},
    {h:'4. La población en España hoy', html:`
      <ul><li><b>Baja natalidad:</b> nacen pocos niños, porque se tienen hijos más tarde y en menor número (por el precio de la vivienda, los trabajos inestables, etc.).</li>
      <li><b>Envejecimiento:</b> la esperanza de vida es de las más altas del mundo y hay cada vez más personas mayores.</li>
      <li><b>Inmigración:</b> la llegada de personas de otros países es lo que más hace crecer la población española en los últimos años.</li></ul>
      <p class="ojo"><b>Consecuencias del envejecimiento:</b> hace falta más gasto en pensiones y sanidad, y hay menos población en edad de trabajar.</p>`}
  ],
  juego:'social-poblacion',
  ficha:{ ejercicios:[
    {e:'Define con tus palabras.', items:['a) Densidad de población','b) Crecimiento natural','c) Saldo migratorio','d) Esperanza de vida'], lineas:4,
      sol:'a) Habitantes por km². · b) Nacimientos menos defunciones. · c) Inmigrantes menos emigrantes. · d) Años que se espera que viva de media una persona.'},
    {e:'Calcula.', items:['a) Densidad de una ciudad de 600.000 habitantes y 400 km².','b) Crecimiento natural de un pueblo con 80 nacimientos y 120 defunciones.'], lineas:3,
      sol:'a) 600.000 ÷ 400 = 1.500 hab/km² · b) 80 − 120 = −40 (la población baja).'},
    {e:'Une cada pirámide con su descripción.', items:['Progresiva','Regresiva','Estancada','→ base estrecha, población envejecida','→ base ancha, población joven','→ forma de campana, casi no cambia'], lineas:2,
      sol:'Progresiva → base ancha, población joven · Regresiva → base estrecha, envejecida · Estancada → forma de campana.'},
    {e:'¿Por qué hay más población en la costa que en el interior de España? Da dos razones.', items:[], lineas:3,
      sol:'Ejemplos: clima más suave, más trabajo (turismo, servicios), terreno llano, buenas comunicaciones y puertos.'},
    {e:'Escribe dos consecuencias del envejecimiento de la población.', items:[], lineas:3,
      sol:'Más gasto en pensiones y en sanidad; menos personas en edad de trabajar.'}
  ]}
},
'lengua-tilde': { ambito:'comunicacion', area:'Lengua', clase:5, titulo:'La tilde',
  intro:'Aprende cuándo una palabra lleva tilde. Con cuatro pasos y unas pocas reglas puedes acertar casi siempre.',
  apartados:[
    {h:'1. La sílaba tónica', html:`
      <p>Todas las palabras de más de una sílaba tienen una sílaba que se pronuncia con más fuerza: es la <b>sílaba tónica</b>. Las demás son <b>átonas</b>.</p>
      <div class="ej">ca-<b>MIÓN</b> · <b>ÁR</b>-bol · <b>MÚ</b>-si-ca · ven-<b>TA</b>-na · pa-<b>PEL</b></div>
      <p>La <b>tilde</b> (´) es la rayita que a veces se escribe sobre la vocal de la sílaba tónica. Todas las palabras tienen sílaba tónica, pero <b>no todas llevan tilde</b>: depende de las reglas que verás ahora.</p>
      <p class="ojo"><b>Truco:</b> di la palabra como si llamaras a alguien desde lejos («¡ven-TAAA-na!»). La sílaba que alargas es la tónica.</p>`},
    {h:'2. Agudas, llanas, esdrújulas y sobresdrújulas', html:`
      <p>Según dónde esté la sílaba tónica, las palabras se clasifican en cuatro grupos. Contamos las sílabas <b>desde el final</b>.</p>
      <div class="tabla"><table>
        <tr><th>Tipo</th><th>Sílaba tónica</th><th>Llevan tilde…</th><th>Ejemplos</th></tr>
        <tr><td><b>Aguda</b></td><td>Última</td><td>si acaban en <b>vocal, -n o -s</b></td><td>café, camión, compás · <i>sin tilde:</i> reloj, papel, ciudad, comer</td></tr>
        <tr><td><b>Llana</b></td><td>Penúltima</td><td>si <b>no</b> acaban en vocal, -n o -s</td><td>árbol, lápiz, fácil, móvil · <i>sin tilde:</i> mesa, joven, lunes, examen</td></tr>
        <tr><td><b>Esdrújula</b></td><td>Antepenúltima</td><td><b>siempre</b></td><td>música, teléfono, sábado, Málaga</td></tr>
        <tr><td><b>Sobresdrújula</b></td><td>Antes de la antepenúltima</td><td><b>siempre</b></td><td>dígamelo, explícaselo</td></tr>
      </table></div>
      <p class="ojo"><b>Fíjate:</b> las reglas de agudas y llanas son contrarias. Si una aguda lleva tilde con -n (camión), una llana con -n no la lleva (joven).</p>
      <p><b>Casos especiales:</b> si la palabra acaba en -n o -s detrás de otra consonante, cuenta como si acabara en consonante: <i>robots</i> (aguda, sin tilde), <i>bíceps</i> o <i>cómics</i> (llanas, con tilde).</p>
      <p><b>En plural la tilde puede cambiar</b>, porque cambia el número de sílabas: examen → exámenes, joven → jóvenes, camión → camiones.</p>
      <details><summary>Practica: ¿aguda, llana o esdrújula? «sofá», «lunes», «rápido»</summary><p>Sofá: aguda acabada en vocal, con tilde. Lunes: llana acabada en -s, sin tilde. Rápido: esdrújula, siempre con tilde.</p></details>`},
    {h:'3. Los monosílabos', html:`
      <p>Las palabras de una sola sílaba <b>no llevan tilde</b>: <i>fue, fui, dio, vio, pie, sol, mar, pan, guion</i>.</p>
      <p>Solo la llevan algunos monosílabos para distinguirse de otro igual que significa algo distinto. Es la <b>tilde diacrítica</b>.</p>`},
    {h:'4. La tilde diacrítica', html:`
      <div class="tabla"><table>
        <tr><th>Con tilde</th><th>Sin tilde</th></tr>
        <tr><td><b>él</b> (pronombre): <i>Él trabaja aquí.</i></td><td><b>el</b> (artículo): <i>el coche</i></td></tr>
        <tr><td><b>tú</b> (pronombre): <i>Tú tienes razón.</i></td><td><b>tu</b> (posesivo): <i>tu casa</i></td></tr>
        <tr><td><b>mí</b> (pronombre): <i>Es para mí.</i></td><td><b>mi</b> (posesivo): <i>mi móvil</i></td></tr>
        <tr><td><b>sí</b> (afirmación o pronombre): <i>Sí, quiero.</i></td><td><b>si</b> (condición): <i>Si llueve, no voy.</i></td></tr>
        <tr><td><b>té</b> (bebida): <i>un té verde</i></td><td><b>te</b> (pronombre): <i>Te llamo luego.</i></td></tr>
        <tr><td><b>dé</b> (verbo dar): <i>Dile que me lo dé.</i></td><td><b>de</b> (preposición): <i>la casa de Ana</i></td></tr>
        <tr><td><b>sé</b> (saber o ser): <i>No sé nada.</i></td><td><b>se</b> (pronombre): <i>Se fue pronto.</i></td></tr>
        <tr><td><b>más</b> (cantidad): <i>Quiero más.</i></td><td><b>mas</b> (= pero, poco usado)</td></tr>
      </table></div>
      <p><b>Interrogativos y exclamativos.</b> <i>Qué, quién, cuál, cómo, cuándo, dónde, cuánto</i> llevan tilde cuando preguntan o exclaman, también dentro de una frase: <i>¿Qué quieres?</i> · <i>Dime qué quieres.</i> · <i>¡Qué frío!</i> Sin pregunta, van sin tilde: <i>Quiero que vengas.</i> · <i>Cuando llegues, avísame.</i></p>
      <p><b>Aún / aun.</b> <i>Aún</i> = todavía (<i>Aún no ha llegado</i>). <i>Aun</i> = incluso (<i>Aun así, iré</i>).</p>
      <p class="ojo"><b>Normas actuales:</b> <i>solo</i> y los demostrativos (<i>este, ese, aquel</i>) se escriben sin tilde.</p>`},
    {h:'5. Diptongos, triptongos e hiatos', html:`
      <p>Las vocales se dividen en <b>abiertas</b> (a, e, o) y <b>cerradas</b> (i, u).</p>
      <p><b>Diptongo:</b> dos vocales seguidas en la misma sílaba. Se forma con una abierta y una cerrada sin acento (<i>cau-sa, pei-ne, can-ción</i>) o con dos cerradas distintas (<i>ciu-dad, rui-do</i>). Se aplican las reglas generales: <i>canción</i> lleva tilde por ser aguda en -n. La tilde va en la vocal abierta (<i>camión, después</i>) o, si las dos son cerradas, en la segunda (<i>cuídate</i>).</p>
      <p><b>Triptongo:</b> tres vocales en la misma sílaba: <i>buey, Paraguay, averiguáis</i>.</p>
      <p><b>Hiato:</b> dos vocales seguidas en sílabas distintas.</p>
      <ul>
        <li>Dos vocales abiertas: siguen las reglas generales. <i>le-ón</i> (aguda en -n, con tilde), <i>ca-er</i> (aguda en -r, sin tilde), <i>po-e-ta</i>.</li>
        <li>Una cerrada <b>tónica</b> junto a una abierta: la cerrada <b>lleva tilde siempre</b>, aunque las reglas generales digan lo contrario: <i>dí-a, rí-o, pa-ís, ma-íz, ba-úl, o-í-do, Ma-rí-a</i>.</li>
      </ul>
      <details><summary>Practica: ¿por qué lleva tilde «país» si es aguda acabada en -s?</summary><p>Lleva tilde por dos razones: es aguda acabada en -s y, además, tiene un hiato con la i tónica (pa-ís). Sin tilde se leería «pais», en una sola sílaba.</p></details>`},
    {h:'6. Cuatro pasos para no fallar', html:`
      <ol class="pasos">
        <li><b>Separa</b> la palabra en sílabas: <i>te-lé-fo-no</i>.</li>
        <li><b>Busca</b> la sílaba tónica: <i>LÉ</i>.</li>
        <li><b>Clasifica</b> la palabra: es la antepenúltima, así que es esdrújula.</li>
        <li><b>Aplica</b> la regla: las esdrújulas llevan tilde siempre.</li>
      </ol>
      <p class="ojo">Las <b>mayúsculas</b> también llevan tilde: <i>Álvaro, ÁFRICA, Óscar</i>.</p>`}
  ],
  juego:'lengua-tilde',
  ficha:{ ejercicios:[
    {e:'Separa en sílabas y rodea la sílaba tónica.', items:['ventana','árbol','camión','música','papel','lápiz'], lineas:2,
      sol:'ven-TA-na · ÁR-bol · ca-MIÓN · MÚ-si-ca · pa-PEL · LÁ-piz'},
    {e:'Clasifica estas palabras en agudas, llanas y esdrújulas.', items:['sofá','examen','teléfono','reloj','fácil','sábado','canción','joven'], lineas:3,
      sol:'Agudas: sofá, reloj, canción. Llanas: examen, fácil, joven. Esdrújulas: teléfono, sábado.'},
    {e:'Pon la tilde a las palabras que la necesiten.', items:['cafe','arbol','mesa','rapido','jamon','lunes','azucar','pared'], lineas:2,
      sol:'café, árbol, mesa, rápido, jamón, lunes, azúcar, pared.'},

      sol:'a) Tu, tú · b) mí, mi · c) Él, el · d) Si, Sí · e) Qué, té.'},
