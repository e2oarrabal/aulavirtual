'ingles-there-is': { ambito:'comunicacion', area:'Inglés', clase:5, titulo:'There is / there are · some / any · prepositions of place',
  intro:'Aprende a decir qué hay en tu casa y en tu barrio, y dónde está cada cosa.',
  apartados:[
    {h:'1. There is / there are (hay)', html:`
      <p>En inglés, «hay» se dice de dos formas según lo que venga detrás:</p>
      <ul><li><b>There is</b> (<i>there's</i>) + singular o incontable: <i>There is a bank near my house. There is some milk.</i></li>
      <li><b>There are</b> + plural: <i>There are two parks in my neighbourhood.</i></li></ul>
      <div class="tabla"><table>
        <tr><th></th><th>Singular</th><th>Plural</th></tr>
        <tr><td><b>Afirmativa</b></td><td>There is a cinema.</td><td>There are some shops.</td></tr>
        <tr><td><b>Negativa</b></td><td>There isn't a cinema.</td><td>There aren't any shops.</td></tr>
        <tr><td><b>Pregunta</b></td><td>Is there a cinema?</td><td>Are there any shops?</td></tr>
        <tr><td><b>Respuesta corta</b></td><td>Yes, there is. / No, there isn't.</td><td>Yes, there are. / No, there aren't.</td></tr>
      </table></div>
      <p>Para preguntar cuántos hay: <i>How many bedrooms are there? — There are three.</i></p>
      <p class="ojo"><b>Errores típicos:</b> «hay» nunca es <i>it has</i> ni <i>have</i>. Y en la respuesta corta afirmativa no se contrae: <i>Yes, there is</i>, no «Yes, there's».</p>`},
    {h:'2. Some / any', html:`
      <p>Se usan con plurales (<i>chairs, shops</i>) y con incontables (<i>milk, water, money</i>). Con un singular contable se usa <b>a / an</b>.</p>
      <ul><li><b>some</b> en frases afirmativas: <i>There are some chairs. I have some money.</i></li>
      <li><b>any</b> en negativas y preguntas: <i>There isn't any bread. Are there any buses?</i></li></ul>
      <p class="ojo"><b>Excepción:</b> para ofrecer o pedir algo se usa <i>some</i> aunque sea pregunta: <i>Would you like some tea? Can I have some water?</i></p>`},
    {h:'3. Prepositions of place (preposiciones de lugar)', html:`
      <div class="tabla"><table>
        <tr><th>Inglés</th><th>Español</th><th>Ejemplo</th></tr>
        <tr><td><b>in</b></td><td>en, dentro de</td><td>The keys are in my bag.</td></tr>
        <tr><td><b>on</b></td><td>en, sobre (tocando)</td><td>The phone is on the table.</td></tr>
        <tr><td><b>under</b></td><td>debajo de</td><td>The dog is under the bed.</td></tr>
        <tr><td><b>next to</b></td><td>al lado de</td><td>The pharmacy is next to the bank.</td></tr>
        <tr><td><b>between</b></td><td>entre</td><td>The bar is between the bank and the school.</td></tr>
        <tr><td><b>behind</b></td><td>detrás de</td><td>The garden is behind the house.</td></tr>
        <tr><td><b>in front of</b></td><td>delante de</td><td>The bus stop is in front of my house.</td></tr>
        <tr><td><b>opposite</b></td><td>enfrente de</td><td>The park is opposite the school.</td></tr>
        <tr><td><b>near</b></td><td>cerca de</td><td>I live near the beach.</td></tr>
      </table></div>
      <p class="ojo"><b>Cuidado:</b> <i>in front of</i> es «delante de», no «enfrente de». Para «enfrente», al otro lado de la calle, se usa <i>opposite</i>.</p>`},
    {h:'4. Vocabulary: the house and the city', html:`
      <p><b>The house:</b> kitchen (cocina), living room (salón), bedroom (dormitorio), bathroom (baño), garden (jardín), sofa (sofá), fridge (frigorífico), bed (cama), table (mesa), chair (silla), window (ventana).</p>
      <p><b>The city:</b> bank (banco), hospital, pharmacy (farmacia), supermarket, bus station (estación de autobuses), train station, park, school, library (biblioteca), cinema, restaurant, street (calle), square (plaza), neighbourhood (barrio).</p>`},
    {h:'5. Model text: my neighbourhood', html:`
      <p>Así puede ser una redacción de 50-70 palabras como la del examen:</p>
      <div class="ej" style="text-align:left">I live in a small neighbourhood in Málaga. There is a big square and there are a lot of small shops. There is a supermarket opposite my house and there is a pharmacy next to the bank. There isn't a cinema, but there are two parks. I like my neighbourhood because there are some good bars and the people are friendly.</div>
      <details><summary>¿Qué estructuras usa?</summary><p>There is / there are, there isn't, some, a lot of, y tres preposiciones (opposite, next to, in). Tiene unas 65 palabras.</p></details>`}
  ],
  juego:'ingles-there-is',
  ficha:{ ejercicios:[
    {e:'Complete with there is or there are.', items:['a) ______ a park in my street.','b) ______ two supermarkets near my house.','c) ______ some water in the bottle.','d) ______ a lot of people in the square.','e) ______ a bed and a table in my room.'], lineas:0,
      sol:'a) There is · b) There are · c) There is · d) There are · e) There is'},
    {e:'Write the negative and the question.', items:['a) There is a cinema.','b) There are some shops.'], lineas:4,
      sol:"a) There isn't a cinema. / Is there a cinema? · b) There aren't any shops. / Are there any shops?"},
    {e:'Complete with some or any.', items:['a) There are ______ chairs in the kitchen.','b) Is there ______ bread?','c) There aren\'t ______ buses on Sundays.','d) I have ______ friends in Málaga.'], lineas:0,
      sol:'a) some · b) any · c) any · d) some'},
    {e:'Translate into English.', items:['a) El móvil está encima de la mesa.','b) La farmacia está al lado del banco.','c) El parque está enfrente del colegio.','d) El perro está debajo de la cama.'], lineas:4,
      sol:'a) The phone is on the table. · b) The pharmacy is next to the bank. · c) The park is opposite the school. · d) The dog is under the bed.'},
    {e:'Writing: describe your neighbourhood (50-70 words). Use there is / there are, some / any and three prepositions of place.', items:[], lineas:9,
      sol:'Respuesta libre. Modelo: I live in a small neighbourhood in Málaga. There is a big square and there are a lot of small shops. There is a supermarket opposite my house and there is a pharmacy next to the bank. There isn\'t a cinema, but there are two parks. I like my neighbourhood because there are some good bars and the people are friendly.'}
  ]}
}
};

  {e:'¿Comunicación verbal (V) o no verbal (NV)? Si es verbal, di si es oral u escrita.', items:['a) Una señal de prohibido aparcar','b) Una llamada de teléfono','c) Un emoji de corazón','d) Una carta de presentación','e) Un pulgar arriba','f) Un audio de WhatsApp'], lineas:0,
    sol:'a) NV · b) V oral · c) NV · d) V escrita · e) NV · f) V oral'},
  {e:'Escribe la intención comunicativa de cada texto.', items:['a) «El tren a Sevilla sale a las 10:15 por la vía 3.»','b) «¡Estoy feliz, por fin tengo trabajo!»','c) «Recicla: el planeta te lo agradecerá.»','d) «Mezcla la harina con los huevos y bate dos minutos.»','e) «Verde que te quiero verde» (poema)','f) «Mañana lloverá en toda Andalucía.»'], lineas:0,
    sol:'a) Informar · b) Expresar · c) Persuadir · d) Ordenar/instrucciones · e) Crear belleza · f) Informar'},
  {e:'Une cada frase con su función del lenguaje: representativa, expresiva, apelativa, poética, fática o metalingüística.', items:['a) «¿Me oyes? Se corta.»','b) «"Casa" es un sustantivo.»','c) «¡Qué miedo he pasado!»','d) «Ven aquí ahora mismo.»','e) «El agua hierve a 100 °C.»','f) «Tus ojos son dos luceros.»'], lineas:0,
    sol:'a) Fática · b) Metalingüística · c) Expresiva · d) Apelativa · e) Representativa · f) Poética'},
  {e:'¿Qué falla en estas situaciones? Di qué elemento de la comunicación provoca el problema.', items:['a) Un turista japonés pregunta en japonés por una calle a un vecino de Málaga.','b) Intentas llamar, pero en el metro no hay cobertura.','c) Un amigo te escribe «ok» y no sabes si está enfadado o no.'], lineas:4,
    sol:'a) El código: no comparten idioma. · b) El canal (ruido: no hay cobertura). · c) El contexto: sin tono de voz ni gestos, el mensaje es ambiguo.'},
  {e:'Lee este anuncio y responde.', items:['«¿Cansado de buscar trabajo? Apúntate GRATIS a nuestro curso de carretillero. Plazas limitadas. ¡Llama ya al 600 000 000!»','a) ¿Qué intención tiene?','b) Copia dos palabras o expresiones que lo demuestren.','c) ¿A quién se dirige (receptor)?'], lineas:4,
    sol:'a) Persuadir. · b) «Apúntate», «¡Llama ya!», «GRATIS», «Plazas limitadas». · c) A personas que buscan trabajo.'},
  {e:'Escribe un mensaje corto para cada intención.', items:['a) Informar a tu grupo de que mañana no hay clase','b) Expresar cómo te sientes hoy','c) Convencer a un amigo para que venga a clase'], lineas:6,
    sol:'Respuesta libre. Ejemplos: a) Mañana no hay clase porque es festivo. b) Hoy estoy muy contento porque he aprobado. c) Vente mañana a clase, que hacemos un concurso y sin ti perdemos.'},
  {e:'Verdadero o falso. Corrige las falsas.', items:['a) El receptor es quien envía el mensaje.','b) El canal en una carta es el papel.','c) Un texto solo puede tener una intención.','d) La función fática comprueba que el canal funciona.'], lineas:3,
    sol:'a) F: es quien lo recibe. · b) V · c) F: puede tener varias, aunque predomine una. · d) V'}
]};

  {e:'Copia tres conectores del texto y di para qué sirven.', items:[], lineas:3, sol:'«En cambio» (oposición), «por eso» (consecuencia), «en definitiva» (conclusión); «porque» (causa).'},

TEMAS['cie-universo'] = { ambito:'cientifico', area:'Ciencias', clase:1, titulo:'El Universo y la Tierra',
  intro:'Qué es el Universo, cómo son las galaxias, las estrellas y el sistema solar, cómo se mueven la Tierra y la Luna y por qué la Tierra es el único planeta conocido con vida.',
  apartados:[
    {h:'1. ¿Qué es el Universo?', html:`
      <p>El <b>Universo</b> es todo lo que existe: la materia (planetas, estrellas, gas, polvo), la energía (como la luz) y el espacio que lo contiene. Es tan grande que todavía no sabemos dónde acaba.</p>
      <p>La teoría más aceptada sobre su origen es el <b>Big Bang</b> (la gran explosión): hace unos <b>13.800 millones de años</b> toda la materia y la energía estaban concentradas en un punto muy pequeño y muy caliente que empezó a expandirse. El Universo <b>sigue expandiéndose hoy</b>: las galaxias se alejan unas de otras.</p>
      <p>Para medir distancias tan enormes no sirven los kilómetros. Se usa el <b>año luz</b>: la distancia que recorre la luz en un año, unos <b>9,5 billones de km</b> (9,5 × 10¹² km). La luz viaja a <b>300.000 km por segundo</b>.</p>
      <p class="ojo"><b>Ojo:</b> el año luz es una medida de <b>distancia</b>, no de tiempo, aunque lleve la palabra «año».</p>
      <details><summary>Practica: la estrella más cercana al Sol, Próxima Centauri, está a 4,2 años luz. ¿Qué significa?</summary><p>Que su luz tarda 4,2 años en llegar hasta nosotros. Cuando la vemos, la estamos viendo como era hace 4,2 años.</p></details>`},
    {h:'2. Galaxias y estrellas', html:`
      <p>Una <b>galaxia</b> es un enorme conjunto de estrellas, gas y polvo que se mantienen unidos por la <b>gravedad</b>. En el Universo hay miles de millones de galaxias.</p>
      <div class="tabla"><table>
        <tr><th>Tipo de galaxia</th><th>Cómo es</th></tr>
        <tr><td><b>Espiral</b></td><td>Un centro abultado con brazos que giran alrededor. Ejemplo: la <b>Vía Láctea</b>.</td></tr>
        <tr><td><b>Elíptica</b></td><td>Forma de balón o de huevo, sin brazos.</td></tr>
        <tr><td><b>Irregular</b></td><td>Sin una forma definida.</td></tr>
      </table></div>
      <p>Nuestra galaxia es la <b>Vía Láctea</b>: una galaxia espiral con más de 100.000 millones de estrellas. El Sol está en uno de sus brazos, lejos del centro.</p>
      <p>Las <b>estrellas</b> son enormes bolas de gas (sobre todo <b>hidrógeno y helio</b>) que producen luz y calor por <b>reacciones nucleares</b> en su interior. Nacen en nubes de gas y polvo llamadas <b>nebulosas</b>. El <b>Sol</b> es una estrella mediana, la más cercana a nosotros. Las <b>constelaciones</b> son grupos de estrellas que vemos formando figuras en el cielo, como la Osa Mayor.</p>`},
    {h:'3. El sistema solar', html:`
      <p>El <b>sistema solar</b> está formado por el <b>Sol</b> y todo lo que gira a su alrededor atraído por su gravedad. El Sol tiene el 99,8 % de toda la masa del sistema solar.</p>
      <div class="tabla"><table>
        <tr><th>Componente</th><th>Qué es</th><th>Ejemplos</th></tr>
        <tr><td><b>Planetas interiores o rocosos</b></td><td>Pequeños, sólidos y cercanos al Sol</td><td>Mercurio, Venus, Tierra, Marte</td></tr>
        <tr><td><b>Planetas exteriores o gaseosos</b></td><td>Gigantes de gas, lejanos y con anillos</td><td>Júpiter (el más grande), Saturno, Urano, Neptuno</td></tr>
        <tr><td><b>Planetas enanos</b></td><td>Redondos, pero no han «limpiado» su órbita</td><td>Plutón, Ceres</td></tr>
        <tr><td><b>Satélites</b></td><td>Giran alrededor de un planeta</td><td>La Luna</td></tr>
        <tr><td><b>Asteroides</b></td><td>Rocas que giran alrededor del Sol, muchas entre Marte y Júpiter (cinturón de asteroides)</td><td>Vesta</td></tr>
        <tr><td><b>Cometas</b></td><td>Bolas de hielo y polvo; al acercarse al Sol forman una cola brillante</td><td>Cometa Halley</td></tr>
      </table></div>
      <p class="ojo"><b>Truco para el orden de los planetas:</b> «<b>M</b>i <b>V</b>ecino <b>T</b>iene <b>M</b>uchas <b>J</b>aulas <b>S</b>in <b>U</b>sar <b>N</b>unca»: Mercurio, Venus, Tierra, Marte, Júpiter, Saturno, Urano y Neptuno.</p>
      <p>La Tierra está a unos <b>150 millones de km</b> del Sol. Su luz tarda unos <b>8 minutos</b> en llegarnos.</p>`},
    {h:'4. Los movimientos de la Tierra y la Luna', html:`
      <div class="tabla"><table>
        <tr><th>Movimiento</th><th>Qué es</th><th>Cuánto dura</th><th>Consecuencia</th></tr>
        <tr><td><b>Rotación</b></td><td>La Tierra gira sobre sí misma, alrededor de su eje</td><td>24 horas (un día)</td><td>El <b>día y la noche</b></td></tr>
        <tr><td><b>Traslación</b></td><td>La Tierra da una vuelta alrededor del Sol</td><td>365 días y 6 horas (un año)</td><td>Las <b>estaciones</b>, junto con la inclinación del eje</td></tr>
      </table></div>
      <p>Las 6 horas que sobran cada año se juntan cada cuatro años en un día más: el 29 de febrero de los <b>años bisiestos</b>.</p>
      <p><b>¿Por qué hay estaciones?</b> El eje de la Tierra está <b>inclinado unos 23,5°</b>. Mientras da la vuelta al Sol, unas veces el hemisferio norte recibe los rayos más directos (verano) y otras más inclinados (invierno). <b>No es porque estemos más cerca o más lejos del Sol.</b></p>
      <ul>
        <li><b>Solsticios</b> (21 de junio y 21 de diciembre): el día más largo y el más corto del año.</li>
        <li><b>Equinoccios</b> (hacia el 21 de marzo y el 23 de septiembre): el día y la noche duran lo mismo.</li>
      </ul>
      <p>La <b>Luna</b> tarda unos <b>28 días</b> en dar la vuelta a la Tierra y siempre nos enseña la misma cara. Según cómo la ilumina el Sol vemos sus <b>fases</b>: luna nueva, cuarto creciente, luna llena y cuarto menguante. La Luna también provoca las <b>mareas</b> con su gravedad. Cuando el Sol, la Tierra y la Luna se alinean hay <b>eclipses</b>: de Sol, si la Luna tapa el Sol; de Luna, si la sombra de la Tierra cae sobre la Luna.</p>
      <details><summary>Practica: en Málaga en julio hace calor y en Argentina hace frío. ¿Por qué, si es el mismo día?</summary><p>Porque están en hemisferios distintos. En julio el hemisferio norte (Málaga) recibe los rayos del Sol más directos y es verano; el hemisferio sur (Argentina) los recibe más inclinados y es invierno.</p></details>`},
    {h:'5. La Tierra, un planeta con vida', html:`
      <p>La Tierra es el único planeta conocido con vida. Lo es porque reúne varias condiciones a la vez:</p>
      <div class="tabla"><table>
        <tr><th>Condición</th><th>Por qué es importante</th></tr>
        <tr><td><b>Distancia adecuada al Sol</b></td><td>Ni demasiado cerca ni demasiado lejos: la temperatura permite que haya <b>agua líquida</b>.</td></tr>
        <tr><td><b>Agua líquida</b></td><td>Es imprescindible para todos los seres vivos.</td></tr>
        <tr><td><b>Atmósfera</b></td><td>Contiene oxígeno, nos protege de la radiación ultravioleta (capa de ozono) y mantiene una temperatura suave (efecto invernadero natural).</td></tr>
        <tr><td><b>Campo magnético</b></td><td>Funciona como un escudo frente a las partículas que lanza el Sol (viento solar).</td></tr>
        <tr><td><b>Bioelementos</b></td><td>Los elementos que forman los seres vivos: <b>carbono (C), hidrógeno (H), oxígeno (O), nitrógeno (N)</b>, fósforo (P) y azufre (S).</td></tr>
      </table></div>
      <p><b>Comparación con la Luna:</b> la Luna está a la misma distancia del Sol, pero no tiene atmósfera ni agua líquida. Por eso pasa de unos 120 °C de día a −170 °C de noche y no tiene vida.</p>
      <p class="ojo"><b>En el examen:</b> en abril de 2025 salió un verdadero o falso sobre las condiciones para la vida en la Tierra y su comparación con la Luna.</p>`}
  ],
  juego:'cie-universo'
};

TEMAS['cie-elementos'] = { ambito:'cientifico', area:'Ciencias', clase:3, titulo:'Los elementos químicos: el átomo y la tabla periódica',
  intro:'De qué está hecha la materia: los átomos y sus partes, el número atómico y el másico, la tabla periódica y la diferencia entre elementos y compuestos.',
  apartados:[
    {h:'1. La materia está hecha de átomos', html:`
      <p>Todo lo que nos rodea, nuestro cuerpo incluido, está formado por partículas diminutas llamadas <b>átomos</b>. Son tan pequeños que en la punta de un alfiler caben millones de millones.</p>
      <p>Un <b>elemento químico</b> es una sustancia formada por un solo tipo de átomo. Se conocen <b>118 elementos</b>; unos 90 existen en la naturaleza y el resto se han fabricado en laboratorios. Cada elemento tiene un <b>símbolo</b> de una o dos letras; la primera siempre va en mayúscula.</p>
      <div class="tabla"><table>
        <tr><th>Elemento</th><th>Símbolo</th><th>Elemento</th><th>Símbolo</th></tr>
        <tr><td>Hidrógeno</td><td><b>H</b></td><td>Sodio</td><td><b>Na</b></td></tr>
        <tr><td>Helio</td><td><b>He</b></td><td>Hierro</td><td><b>Fe</b></td></tr>
        <tr><td>Carbono</td><td><b>C</b></td><td>Cobre</td><td><b>Cu</b></td></tr>
        <tr><td>Nitrógeno</td><td><b>N</b></td><td>Oro</td><td><b>Au</b></td></tr>
        <tr><td>Oxígeno</td><td><b>O</b></td><td>Plata</td><td><b>Ag</b></td></tr>
        <tr><td>Calcio</td><td><b>Ca</b></td><td>Cloro</td><td><b>Cl</b></td></tr>
      </table></div>
      <p>En el <b>Universo</b> los elementos más abundantes son el <b>hidrógeno y el helio</b>, que forman las estrellas. En la corteza terrestre abundan el <b>oxígeno y el silicio</b>. En los seres vivos, el <b>carbono, hidrógeno, oxígeno y nitrógeno</b>.</p>`},
    {h:'2. Las partes del átomo', html:`
      <p>El átomo tiene dos zonas: el <b>núcleo</b>, en el centro, y la <b>corteza</b>, alrededor, donde se mueven los electrones.</p>
      <div class="tabla"><table>
        <tr><th>Partícula</th><th>Dónde está</th><th>Carga</th></tr>
        <tr><td><b>Protón</b></td><td>Núcleo</td><td>Positiva (+)</td></tr>
        <tr><td><b>Neutrón</b></td><td>Núcleo</td><td>Sin carga (neutra)</td></tr>
        <tr><td><b>Electrón</b></td><td>Corteza</td><td>Negativa (−)</td></tr>
      </table></div>
      <p>Casi toda la masa del átomo está en el núcleo. Los electrones pesan muchísimo menos que los protones y los neutrones.</p>
      <p class="ojo"><b>Un átomo es neutro</b> (no tiene carga) cuando tiene el <b>mismo número de protones que de electrones</b>: las cargas + y − se compensan.</p>`},
    {h:'3. Número atómico, número másico e iones', html:`
      <div class="tabla"><table>
        <tr><th>Concepto</th><th>Letra</th><th>Qué indica</th></tr>
        <tr><td><b>Número atómico</b></td><td>Z</td><td>El número de <b>protones</b>. Es el «DNI» del elemento: todos los átomos de oxígeno tienen Z = 8.</td></tr>
        <tr><td><b>Número másico</b></td><td>A</td><td>Protones + neutrones.</td></tr>
        <tr><td><b>Neutrones</b></td><td>N</td><td>Se calculan restando: <b>N = A − Z</b>.</td></tr>
      </table></div>
      <p>Ejemplo: el sodio tiene <b>Z = 11</b> y <b>A = 23</b>. Tiene 11 protones, 23 − 11 = <b>12 neutrones</b> y, si es neutro, <b>11 electrones</b>.</p>
      <p>Un <b>ion</b> es un átomo que ha ganado o perdido electrones y por eso tiene carga:</p>
      <ul>
        <li><b>Catión</b> (carga +): ha <b>perdido</b> electrones. Ejemplo: Na⁺ tiene 10 electrones.</li>
        <li><b>Anión</b> (carga −): ha <b>ganado</b> electrones. Ejemplo: Cl⁻ tiene 18 electrones (el cloro tiene Z = 17).</li>
      </ul>
      <p>Los <b>isótopos</b> son átomos del mismo elemento (mismo Z) con distinto número de neutrones (distinto A). Ejemplo: el carbono-12 y el carbono-14.</p>
      <details><summary>Practica: el oxígeno tiene Z = 8 y A = 16. ¿Cuántos protones, neutrones y electrones tiene?</summary><p>8 protones, 16 − 8 = <b>8 neutrones</b> y 8 electrones si es neutro.</p></details>
      <details><summary>Practica: el calcio (Z = 20) forma el ion Ca²⁺. ¿Cuántos electrones tiene el ion?</summary><p>Ha perdido 2 electrones: 20 − 2 = <b>18 electrones</b>. Es un catión.</p></details>`},
    {h:'4. La tabla periódica', html:`
      <p>La <b>tabla periódica</b> ordena todos los elementos según su <b>número atómico</b>, de menor a mayor. La ideó el químico ruso <b>Mendeléyev</b> en 1869.</p>
      <ul>
        <li><b>Periodos:</b> las 7 filas horizontales.</li>
        <li><b>Grupos:</b> las 18 columnas verticales. Los elementos de un mismo grupo se parecen en su comportamiento químico.</li>
      </ul>
      <div class="tabla"><table>
        <tr><th>Tipo</th><th>Dónde están</th><th>Cómo son</th><th>Ejemplos</th></tr>
        <tr><td><b>Metales</b></td><td>A la izquierda y en el centro (son la mayoría)</td><td>Brillan, conducen el calor y la electricidad, se pueden doblar y estirar. Casi todos son sólidos.</td><td>Hierro, cobre, aluminio, oro</td></tr>
        <tr><td><b>No metales</b></td><td>A la derecha</td><td>No brillan y conducen mal. Pueden ser sólidos, líquidos o gases.</td><td>Oxígeno, carbono, azufre, cloro</td></tr>
        <tr><td><b>Semimetales o metaloides</b></td><td>En la «escalera» entre unos y otros</td><td>Propiedades intermedias</td><td>Silicio (chips de los móviles)</td></tr>
        <tr><td><b>Gases nobles</b></td><td>La última columna (grupo 18)</td><td>Casi no reaccionan con nada</td><td>Helio, neón, argón</td></tr>
      </table></div>
      <p class="ojo"><b>El hidrógeno</b> está arriba a la izquierda, pero <b>no es un metal</b>: es un gas.</p>`},
    {h:'5. Elementos y compuestos', html:`
      <p>Los átomos se unen entre sí formando <b>moléculas</b> o cristales.</p>
      <ul>
        <li><b>Elemento:</b> sustancia con un solo tipo de átomo. Ejemplo: el oxígeno que respiramos (O₂) son dos átomos de oxígeno unidos.</li>
        <li><b>Compuesto:</b> sustancia formada por dos o más elementos distintos unidos en una proporción fija. Se representa con una <b>fórmula</b>.</li>
      </ul>
      <div class="tabla"><table>
        <tr><th>Compuesto</th><th>Fórmula</th><th>Qué lleva</th></tr>
        <tr><td>Agua</td><td><b>H₂O</b></td><td>2 átomos de hidrógeno y 1 de oxígeno</td></tr>
        <tr><td>Dióxido de carbono</td><td><b>CO₂</b></td><td>1 de carbono y 2 de oxígeno</td></tr>
        <tr><td>Sal común (cloruro de sodio)</td><td><b>NaCl</b></td><td>1 de sodio y 1 de cloro</td></tr>
        <tr><td>Metano (gas natural)</td><td><b>CH₄</b></td><td>1 de carbono y 4 de hidrógeno</td></tr>
      </table></div>
      <p>Un compuesto tiene propiedades muy distintas de sus elementos: el sodio es un metal que reacciona con violencia en el agua y el cloro es un gas tóxico, pero juntos forman la sal que echamos a la comida.</p>
      <details><summary>Practica: ¿cuántos átomos tiene en total una molécula de glucosa, C₆H₁₂O₆?</summary><p>6 de carbono + 12 de hidrógeno + 6 de oxígeno = <b>24 átomos</b>.</p></details>`}
  ],
  juego:'cie-elementos'
};

TEMAS['mat-notacion'] = { ambito:'cientifico', area:'Matemáticas', clase:5, titulo:'La notación científica',
  intro:'Cómo escribir de forma corta números muy grandes, como las distancias del Universo, y muy pequeños, como el tamaño de un átomo.',
  apartados:[
    {h:'1. Las potencias de 10', html:`
      <p>Una <b>potencia</b> es una multiplicación repetida: 10³ = 10 × 10 × 10 = 1.000. El número de abajo es la <b>base</b> y el pequeño de arriba, el <b>exponente</b>.</p>
      <div class="tabla"><table>
        <tr><th>Potencia</th><th>Número</th><th>Se lee</th></tr>
        <tr><td>10⁶</td><td>1.000.000</td><td>un millón</td></tr>
        <tr><td>10³</td><td>1.000</td><td>mil</td></tr>
        <tr><td>10²</td><td>100</td><td>cien</td></tr>
        <tr><td>10¹</td><td>10</td><td>diez</td></tr>
        <tr><td>10⁰</td><td>1</td><td>uno</td></tr>
        <tr><td>10⁻¹</td><td>0,1</td><td>una décima</td></tr>
        <tr><td>10⁻²</td><td>0,01</td><td>una centésima</td></tr>
        <tr><td>10⁻³</td><td>0,001</td><td>una milésima</td></tr>
        <tr><td>10⁻⁶</td><td>0,000001</td><td>una millonésima</td></tr>
      </table></div>
      <p class="ojo"><b>Truco:</b> con exponente positivo, el exponente dice <b>cuántos ceros</b> lleva el número. Con exponente negativo, dice <b>cuántos decimales</b> tiene (contando el 1).</p>`},
    {h:'2. ¿Qué es la notación científica?', html:`
      <p>Es una forma de escribir un número como un número entre 1 y 10 multiplicado por una potencia de 10:</p>
      <p style="text-align:center;font-size:1.25em"><b>a × 10ⁿ</b>, con 1 ≤ a &lt; 10</p>
      <ul>
        <li><b>a</b> tiene <b>una sola cifra entera</b>, que no puede ser 0: 3,5 sí; 35 o 0,35 no.</li>
        <li><b>n</b> es un número entero: positivo para números grandes y negativo para números pequeños.</li>
      </ul>
      <div class="tabla"><table>
        <tr><th>Dato</th><th>Número normal</th><th>Notación científica</th></tr>
        <tr><td>Distancia de la Tierra al Sol</td><td>150.000.000 km</td><td><b>1,5 × 10⁸ km</b></td></tr>
        <tr><td>Velocidad de la luz</td><td>300.000 km/s</td><td><b>3 × 10⁵ km/s</b></td></tr>
        <tr><td>Edad del Universo</td><td>13.800.000.000 años</td><td><b>1,38 × 10¹⁰ años</b></td></tr>
        <tr><td>Grosor de un pelo</td><td>0,00008 m</td><td><b>8 × 10⁻⁵ m</b></td></tr>
        <tr><td>Tamaño de un átomo</td><td>0,0000000001 m</td><td><b>1 × 10⁻¹⁰ m</b></td></tr>
      </table></div>`},
    {h:'3. De número normal a notación científica', html:`
      <p><b>Paso 1:</b> mueve la coma hasta que quede <b>una sola cifra entera</b> distinta de 0.</p>
      <p><b>Paso 2:</b> cuenta cuántos lugares has movido la coma. Ese es el exponente.</p>
      <p><b>Paso 3:</b> si el número era <b>grande</b> (la coma va a la izquierda), el exponente es <b>positivo</b>. Si era <b>pequeño</b>, menor que 1 (la coma va a la derecha), es <b>negativo</b>.</p>
      <div class="tabla"><table>
        <tr><th>Número</th><th>Movemos la coma</th><th>Resultado</th></tr>
        <tr><td>45.000</td><td>4 lugares a la izquierda</td><td><b>4,5 × 10⁴</b></td></tr>
        <tr><td>7.200.000</td><td>6 lugares a la izquierda</td><td><b>7,2 × 10⁶</b></td></tr>
        <tr><td>0,003</td><td>3 lugares a la derecha</td><td><b>3 × 10⁻³</b></td></tr>
        <tr><td>0,00056</td><td>4 lugares a la derecha</td><td><b>5,6 × 10⁻⁴</b></td></tr>
      </table></div>
      <details><summary>Practica: escribe en notación científica 380.000 km (distancia de la Tierra a la Luna).</summary><p>Movemos la coma 5 lugares a la izquierda: <b>3,8 × 10⁵ km</b>.</p></details>
      <details><summary>Practica: escribe en notación científica 0,0072 g.</summary><p>Movemos la coma 3 lugares a la derecha: <b>7,2 × 10⁻³ g</b>.</p></details>`},
    {h:'4. De notación científica a número normal', html:`
      <p>Se hace al revés: el exponente te dice cuántos lugares mover la coma.</p>
      <ul>
        <li><b>Exponente positivo:</b> la coma va a la <b>derecha</b> (el número se hace grande). Se rellena con ceros. 2,3 × 10⁴ = <b>23.000</b>.</li>
        <li><b>Exponente negativo:</b> la coma va a la <b>izquierda</b> (el número se hace pequeño). 6 × 10⁻³ = <b>0,006</b>.</li>
      </ul>
      <details><summary>Practica: escribe como número normal 5,07 × 10⁶ y 1,2 × 10⁻⁴.</summary><p>5,07 × 10⁶ = <b>5.070.000</b> · 1,2 × 10⁻⁴ = <b>0,00012</b>.</p></details>`},
    {h:'5. Comparar y operar', html:`
      <p><b>Comparar:</b> manda el exponente. El número con el exponente mayor es el más grande: 2 × 10⁸ es mayor que 9 × 10⁷. Si los exponentes son iguales, se compara el número de delante.</p>
      <p><b>Multiplicar:</b> se multiplican los números de delante y se <b>suman</b> los exponentes.</p>
      <p style="text-align:center">(3 × 10⁴) · (2 × 10³) = 6 × 10⁷</p>
      <p><b>Dividir:</b> se dividen los números de delante y se <b>restan</b> los exponentes.</p>
      <p style="text-align:center">(8 × 10⁹) : (2 × 10³) = 4 × 10⁶</p>
      <p>Si el número de delante sale mayor que 10, se ajusta: 15 × 10⁵ = 1,5 × 10⁶.</p>
      <p class="ojo"><b>Con la calculadora</b> (se puede llevar al examen): para escribir 3 × 10⁵ pulsa <b>3</b>, luego la tecla <b>EXP</b> o <b>×10ˣ</b> y luego <b>5</b>. Si el resultado sale como «4.5E12», significa 4,5 × 10¹².</p>
      <details><summary>Practica: la luz recorre 3 × 10⁵ km cada segundo. ¿Cuántos km recorre en 500 segundos (5 × 10²)?</summary><p>(3 × 10⁵) · (5 × 10²) = 15 × 10⁷ = <b>1,5 × 10⁸ km</b>. ¡Es la distancia de la Tierra al Sol! La luz del Sol tarda unos 500 segundos (8 minutos) en llegar.</p></details>`}
  ],
  juego:'mat-notacion'
};

TEMAS['mat-enteros'] = { ambito:'cientifico', area:'Matemáticas', clase:6, titulo:'Los números enteros',
  intro:'Los números positivos, negativos y el cero: cómo se ordenan, cómo se opera con ellos y en qué orden se hacen las operaciones combinadas.',
  apartados:[
    {h:'1. ¿Qué son los números enteros?', html:`
      <p>Los <b>números enteros</b> son los números naturales (1, 2, 3…), sus <b>opuestos negativos</b> (−1, −2, −3…) y el <b>0</b>. Los usamos a diario:</p>
      <ul>
        <li>Temperaturas bajo cero: −4 °C.</li>
        <li>Plantas de un edificio: el sótano −2.</li>
        <li>Dinero: un saldo de −50 € es una deuda.</li>
        <li>Altitud: el mar Muerto está a −430 m, por debajo del nivel del mar.</li>
        <li>Historia: el año −218 es el 218 antes de Cristo.</li>
      </ul>
      <p>Se representan en la <b>recta numérica</b>: el 0 en el centro, los positivos a la derecha y los negativos a la izquierda. Cuanto más a la derecha, mayor es el número.</p>
      <div class="tabla"><table>
        <tr><th>Concepto</th><th>Qué es</th><th>Ejemplo</th></tr>
        <tr><td><b>Valor absoluto</b></td><td>La distancia al 0, sin el signo</td><td>|−7| = 7 · |7| = 7</td></tr>
        <tr><td><b>Opuesto</b></td><td>El mismo número con el signo cambiado</td><td>El opuesto de −3 es 3</td></tr>
        <tr><td><b>Orden</b></td><td>Entre negativos, es mayor el que está más cerca del 0</td><td>−2 &gt; −8</td></tr>
      </table></div>
      <details><summary>Practica: ordena de menor a mayor: 3, −5, 0, −1, 7, −10.</summary><p><b>−10 &lt; −5 &lt; −1 &lt; 0 &lt; 3 &lt; 7</b></p></details>`},
    {h:'2. Sumar y restar', html:`
      <ul>
        <li><b>Mismo signo:</b> se suman los números y se deja el signo. −3 − 5 = <b>−8</b> · 4 + 6 = <b>10</b>.</li>
        <li><b>Distinto signo:</b> se restan (el grande menos el pequeño) y se pone el signo del que tiene mayor valor absoluto. −9 + 4 = <b>−5</b> · 12 − 7 = <b>5</b>.</li>
      </ul>
      <p><b>Quitar paréntesis:</b> un signo + delante deja el paréntesis igual; un signo − delante <b>cambia el signo</b> de lo de dentro.</p>
      <p style="text-align:center">5 − (−3) = 5 + 3 = 8 · 5 + (−3) = 5 − 3 = 2</p>
      <p class="ojo"><b>Piénsalo con dinero:</b> positivo es lo que tienes y negativo lo que debes. Si debes 9 € y te dan 4 €, sigues debiendo 5 €: −9 + 4 = −5.</p>
      <details><summary>Practica: por la mañana había −3 °C y a mediodía la temperatura subió 11 grados. ¿Qué temperatura hacía?</summary><p>−3 + 11 = <b>8 °C</b>.</p></details>`},
    {h:'3. Multiplicar y dividir: la regla de los signos', html:`
      <p>Se multiplican o dividen los números y el signo del resultado sigue esta regla:</p>
      <div class="tabla"><table>
        <tr><th>Signos</th><th>Resultado</th><th>Ejemplo</th></tr>
        <tr><td>+ por +</td><td><b>+</b></td><td>3 · 4 = 12</td></tr>
        <tr><td>− por −</td><td><b>+</b></td><td>(−3) · (−4) = 12</td></tr>
        <tr><td>+ por −</td><td><b>−</b></td><td>3 · (−4) = −12</td></tr>
        <tr><td>− por +</td><td><b>−</b></td><td>(−12) : 4 = −3</td></tr>
      </table></div>
      <p class="ojo"><b>Resumen:</b> signos iguales dan <b>+</b>; signos distintos dan <b>−</b>. La regla es la misma para dividir.</p>`},
    {h:'4. Potencias de números enteros', html:`
      <p>Si la base es positiva, el resultado siempre es positivo. Si la base es <b>negativa</b>:</p>
      <ul>
        <li>Exponente <b>par</b> → resultado <b>positivo</b>: (−2)⁴ = 16.</li>
        <li>Exponente <b>impar</b> → resultado <b>negativo</b>: (−2)³ = −8.</li>
      </ul>
      <p class="ojo"><b>Cuidado con el paréntesis:</b> (−3)² = (−3) · (−3) = <b>9</b>, pero −3² = −(3 · 3) = <b>−9</b>, porque sin paréntesis el exponente solo afecta al 3.</p>`},
    {h:'5. Operaciones combinadas', html:`
      <p>Cuando hay varias operaciones, se hacen siempre en este orden (<b>jerarquía de las operaciones</b>):</p>
      <ol>
        <li><b>Paréntesis</b> y corchetes, de dentro hacia fuera.</li>
        <li><b>Potencias</b> y raíces.</li>
        <li><b>Multiplicaciones y divisiones</b>, de izquierda a derecha.</li>
        <li><b>Sumas y restas</b>, de izquierda a derecha.</li>
      </ol>
      <p><b>Ejemplo paso a paso:</b> 8 − 3 · (5 − 7)² : 6</p>
      <ul>
        <li>Paréntesis: 5 − 7 = −2 → 8 − 3 · (−2)² : 6</li>
        <li>Potencia: (−2)² = 4 → 8 − 3 · 4 : 6</li>
        <li>Multiplicación y división, de izquierda a derecha: 3 · 4 = 12; 12 : 6 = 2 → 8 − 2</li>
        <li>Resta: <b>6</b></li>
      </ul>
      <details><summary>Practica: calcula −4 + 6 · (−2) − (3 − 8).</summary><p>Paréntesis: 3 − 8 = −5. Multiplicación: 6 · (−2) = −12. Queda −4 − 12 − (−5) = −4 − 12 + 5 = <b>−11</b>.</p></details>
      <details><summary>Practica: Ana tiene 120 € en el banco. Paga 3 recibos de 45 € y le ingresan 60 €. ¿Cuánto tiene?</summary><p>120 − 3 · 45 + 60 = 120 − 135 + 60 = <b>45 €</b>.</p></details>`}
  ],
  juego:'mat-enteros'
};

TEMAS['cie-tierra'] = { ambito:'cientifico', area:'Ciencias', clase:6, titulo:'La representación de la Tierra · Tierra, aire y agua',
  intro:'Cómo se representa la Tierra en globos y mapas, cómo se usa la escala, y cómo son sus capas: la geosfera, la atmósfera y la hidrosfera.',
  apartados:[
    {h:'1. Cómo se representa la Tierra', html:`
      <p>La Tierra no es una esfera perfecta: está un poco <b>achatada por los polos</b>. Su forma se llama <b>geoide</b>.</p>
      <ul>
        <li>El <b>globo terráqueo</b> es la representación más fiel, porque es redondo como la Tierra, pero es poco práctico.</li>
        <li>Los <b>mapas</b> son representaciones planas. Pasar una esfera a un plano siempre deforma algo: por eso hay distintas <b>proyecciones</b>. En la de Mercator, por ejemplo, Groenlandia parece casi tan grande como África, aunque es unas 14 veces más pequeña.</li>
      </ul>
      <p>Para localizar cualquier punto se usa una red de líneas imaginarias:</p>
      <div class="tabla"><table>
        <tr><th>Línea</th><th>Cómo es</th><th>La principal</th><th>Sirve para medir</th></tr>
        <tr><td><b>Paralelos</b></td><td>Círculos horizontales, paralelos al ecuador</td><td>El <b>ecuador</b> (0°)</td><td>La <b>latitud</b>: de 0° a 90° norte o sur</td></tr>
        <tr><td><b>Meridianos</b></td><td>Semicírculos de polo a polo</td><td>El de <b>Greenwich</b> (0°)</td><td>La <b>longitud</b>: de 0° a 180° este u oeste</td></tr>
      </table></div>
      <p>Ejemplo: Málaga está aproximadamente en <b>36,7° N y 4,4° O</b>.</p>`},
    {h:'2. La escala', html:`
      <p>La <b>escala</b> indica cuántas veces se ha reducido la realidad en un mapa.</p>
      <ul>
        <li><b>Escala numérica:</b> 1:50.000 significa que <b>1 cm del mapa son 50.000 cm reales</b>, es decir, 500 m.</li>
        <li><b>Escala gráfica:</b> una barra dividida en tramos que indica la distancia real de cada uno.</li>
      </ul>
      <p><b>Cómo calcular una distancia real:</b> se multiplica la medida del mapa por el número de la escala y se pasan las unidades.</p>
      <p style="text-align:center">4 cm en un mapa 1:200.000 → 4 × 200.000 = 800.000 cm = <b>8 km</b></p>
      <p class="ojo"><b>Recuerda:</b> 1 km = 1.000 m = 100.000 cm. Para pasar de cm a km, quita cinco ceros o divide entre 100.000.</p>
      <details><summary>Practica: en un mapa 1:25.000 dos pueblos están a 6 cm. ¿A qué distancia real están?</summary><p>6 × 25.000 = 150.000 cm = <b>1,5 km</b>.</p></details>
      <p>Una escala <b>grande</b> (1:5.000) reduce poco y muestra mucho detalle, como el plano de una ciudad. Una escala <b>pequeña</b> (1:10.000.000) reduce mucho y sirve para mapas de países o del mundo.</p>`},
    {h:'3. Las capas de la Tierra', html:`
      <p>La Tierra está formada por varias capas que se relacionan entre sí:</p>
      <div class="tabla"><table>
        <tr><th>Capa</th><th>Qué es</th></tr>
        <tr><td><b>Geosfera</b></td><td>La parte sólida o rocosa. Por dentro tiene la <b>corteza</b> (donde vivimos, de 5 a 70 km de grosor), el <b>manto</b> (rocas a altas temperaturas, parte fundidas) y el <b>núcleo</b> (hierro y níquel, a más de 5.000 °C).</td></tr>
        <tr><td><b>Hidrosfera</b></td><td>Toda el agua: océanos, mares, ríos, lagos, aguas subterráneas y hielo.</td></tr>
        <tr><td><b>Atmósfera</b></td><td>La capa de gases que envuelve la Tierra.</td></tr>
        <tr><td><b>Biosfera</b></td><td>El conjunto de todos los seres vivos y los lugares donde viven.</td></tr>
      </table></div>
      <p class="ojo"><b>En el examen:</b> en 2019 salió una pregunta sobre las capas de la geosfera, la atmósfera y la hidrosfera a partir de un dibujo.</p>`},
    {h:'4. La atmósfera: el aire', html:`
      <p>El aire es una <b>mezcla de gases</b>:</p>
      <div class="tabla"><table>
        <tr><th>Gas</th><th>Cantidad</th><th>Para qué es importante</th></tr>
        <tr><td><b>Nitrógeno</b></td><td>78 %</td><td>Lo usan las plantas para crecer</td></tr>
        <tr><td><b>Oxígeno</b></td><td>21 %</td><td>Lo respiramos los seres vivos</td></tr>
        <tr><td>Argón y otros</td><td>Casi 1 %</td><td></td></tr>
        <tr><td><b>Dióxido de carbono</b></td><td>0,04 %</td><td>Lo usan las plantas en la fotosíntesis; retiene calor</td></tr>
        <tr><td>Vapor de agua</td><td>Variable</td><td>Forma las nubes</td></tr>
      </table></div>
      <p><b>Las capas de la atmósfera</b>, de abajo arriba:</p>
      <ul>
        <li><b>Troposfera</b> (hasta unos 12 km): donde vivimos y donde se forman las nubes, la lluvia y el viento, es decir, el tiempo atmosférico.</li>
        <li><b>Estratosfera</b> (hasta 50 km): contiene la <b>capa de ozono</b>, que filtra los rayos ultravioleta del Sol.</li>
        <li><b>Mesosfera</b>: aquí se queman los meteoritos y forman las «estrellas fugaces».</li>
        <li><b>Termosfera</b> y <b>exosfera</b>: las más altas, donde orbitan muchos satélites.</li>
      </ul>
      <p><b>Funciones:</b> nos da el oxígeno, nos protege de la radiación ultravioleta y de los meteoritos, y mantiene una temperatura suave gracias al <b>efecto invernadero natural</b>. Si aumentan mucho los gases como el CO₂ (al quemar petróleo, carbón o gas), se retiene demasiado calor y se produce el <b>cambio climático</b>.</p>`},
    {h:'5. La hidrosfera: el agua', html:`
      <p>El agua cubre más del <b>70 %</b> de la superficie de la Tierra, por eso se la llama «planeta azul». Pero casi toda es salada:</p>
      <ul>
        <li><b>97 %</b> agua salada (océanos y mares).</li>
        <li><b>3 %</b> agua dulce, y la mayor parte está congelada en los polos y glaciares. El agua dulce que podemos usar es <b>menos del 1 %</b>.</li>
      </ul>
      <p>El agua no se gasta: se mueve sin parar en el <b>ciclo del agua</b>.</p>
      <ol>
        <li><b>Evaporación:</b> el Sol calienta el agua de mares y ríos y se convierte en vapor.</li>
        <li><b>Condensación:</b> el vapor sube, se enfría y forma las nubes.</li>
        <li><b>Precipitación:</b> el agua cae como lluvia, nieve o granizo.</li>
        <li><b>Escorrentía e infiltración:</b> el agua corre por la superficie hasta ríos y mares, o se filtra en el suelo y forma aguas subterráneas.</li>
      </ol>
      <p class="ojo"><b>Andalucía y el agua:</b> en el sur de España llueve poco y hay sequías frecuentes, por eso es tan importante ahorrar agua y no contaminarla.</p>`}
  ],
  juego:'cie-tierra'
};

function estaSemana(a){
  const tsec = a.secciones.find(x=>x.temario); if (!tsec || !tsec.temario.filas.length) return null;
  const hoy = lunesHoy().getTime();
  const f = tsec.temario.filas.find(r=>fecha(r.s).getTime()>=hoy); if (!f) return null;
  const actual = fecha(f.s).getTime()===hoy;
  const temas = [f.ta,f.tb,f.tt].filter(id=>id && TEMAS[id]);
  return {f, actual, temas};
}

function isoLunes(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function agendaHTML(){
  const lun = lunesHoy(); const sem = AGENDA.semanas[isoLunes(lun)];
  const dias = sem ? sem.dias : AGENDA.habitual;
  let hoy = (new Date().getDay()+6)%7 + 1; if (hoy>5) hoy = 1;
  const chips = DIAS.map((n,i)=>{ const d = new Date(lun); d.setDate(lun.getDate()+i);
    const tiene = (dias[i+1]||[]).length; const extra = (dias[i+1]||[]).some(x=>x.tipo==='extra');
    return `<button class="dia" data-d="${i+1}" aria-pressed="${i+1===hoy}"><small>${n.slice(0,3)}</small><b>${d.getDate()}</b><i class="${extra?'ex':tiene?'si':''}"></i></button>`; }).join('');
  return `<div class="sec-t"><h2>${sem ? 'Agenda de la semana' : 'Horario habitual'}</h2></div>
    <section class="agenda">${sem && sem.nota ? `<p class="ag-nota">${esc(sem.nota)}</p>` : ''}<div class="dias">${chips}</div><div class="ag-list" id="aglist"></div></section>`;
}
function pintarDia(n){

    : `<p class="ag-vacio">Este día no hay nada programado.</p>`;
}

function ambito(a, sec=0){
  const s = a.secciones[sec];
  const tabs = a.secciones.length > 1 ? `<div class="tabs" role="tablist">${a.secciones.map((x,i)=>
    `<button class="tab" role="tab" id="tab-${i}" aria-selected="${i===sec}" data-sec="${i}">${x.nombre}</button>`).join('')}</div>` : '';
  const info = s.info ? `<div class="info">${s.info}</div>` : '';
  const its = s.items || [];
  const items = s.libro ? libro(a) : s.temario ? temario(s.temario) : its.length ? its.map(it => {
    const ok = listo(it);
    const body = `<span class="t">${I[it.tipo==='tema'?'libro':it.tipo]}</span><span class="txt"><b>${esc(it.titulo)}</b><small>${esc(it.desc||'')}</small></span>
      <span class="badge">${ok ? TIPO[it.tipo] : 'Próximamente'}</span>`;
    if (!ok) return `<div class="item soon" aria-disabled="true">${body}</div>`;
    if (it.tipo === 'tema') return `<a class="item" href="#tema-${it.tema}">${body}</a>`;
    if (it.tipo === 'juego') return `<a class="item" href="#juego-${it.juego}">${body}</a>`;
    return `<a class="item" href="${esc(it.url)}" target="_blank" rel="noopener">${body}</a>`;
  }).join('') : `<div class="empty">Todavía no hay materiales en esta sección.</div>`;
  app.innerHTML = `
    <section class="head" style="--c:var(${a.c})"><a class="back-in" href="#inicio">${I.back} Inicio</a><h1>${a.nombre}</h1><p>${a.intro}</p></section>
    <div style="--c:var(${a.c})">${tabs}</div><div class="list" style="--c:var(${a.c})">${info}${items}</div>
    <footer>Aula Abierta E2O</footer>`;
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { ambito(a, +b.dataset.sec); });
  if (s.libro) prepararLibro(a);
}


function lunesHoy(){ const d=new Date(); d.setHours(0,0,0,0); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; }
function fecha(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const lk = id => id && TEMAS[id] ? ` <a class="leer" href="#tema-${id}">Estudiar el tema →</a>` : '';
function temario(T){
  if(!T.filas.length) return `<div class="empty">El temario de este ámbito se publicará pronto.</div>`;
  const hoy=lunesHoy().getTime();
  let marcado=false;
  const filas=T.filas.map(f=>{
    const d=fecha(f.s), t=d.getTime();
    let st='prox', lab='Próxima';
    if(t<hoy){st='hecha';lab='Hecha';} else if(t===hoy){st='ahora';lab='Esta semana';}
    else if(!marcado){st='sig';lab='Siguiente';}
    if(t>=hoy) marcado=true;
    const partes = f.t
      ? `<p><span class="tag">${esc(f.t)}</span>${esc(f.a)}${lk(f.tt)}</p>`
      : [f.a?`<p><span class="tag">${T.la}</span>${esc(f.a)}${lk(f.ta)}</p>`:'', f.b?`<p><span class="tag">${T.lb}</span>${esc(f.b)}${lk(f.tb)}</p>`:''].join('');
    return `<article class="clase ${st}"><header><b>Clase ${f.n}</b><span>Semana del ${d.getDate()} ${MESES[d.getMonth()]}</span><em>${lab}</em></header>${partes}</article>`;
  }).join('');
  return `<p class="tip">¿Quieres adelantar? Aquí tienes lo que veremos cada semana hasta el examen de abril.</p>${filas}`;
}


function videoHTML(v){ return v ? `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener"><span class="vid-ic">${I.video}</span><span><small>Vídeo · se abre en YouTube</small><b>${esc(v.t)}</b></span><span class="chev">↗</span></a>` : ''; }

async function b64(url){ const r = await fetch(url); if(!r.ok) throw new Error(url); const buf = await r.arrayBuffer(); let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function pdfAssets(){
  if (PDFA) return PDFA;

const sinFlecha = o => JSON.parse(JSON.stringify(o, (k,v)=> typeof v==='string' && k!=='image' && !v.startsWith('data:') ? v.replace(/→/g,'»') : v));
async function crearPDF(doc){
  const pm = await pdfLib(); const A = await pdfAssets();
  const bg = doc.background, pbb = doc.pageBreakBefore, ft = doc.footer;
  doc = sinFlecha(doc); doc.background = bg; doc.pageBreakBefore = pbb; doc.footer = ft;
  doc.images = Object.assign({}, A.img, doc.images||{});
  const figs = [...new Set((JSON.stringify(doc.content).match(/fig\/[a-z0-9-]+\.jpg/g)||[]))];
  await Promise.all(figs.map(async f=>{ doc.images[f] = 'data:image/jpeg;base64,' + await b64(f); }));
  return new Promise(r => pm.createPdf(doc, null, A.fonts, A.vfs).getBlob(r));
}

async function guardar(nombre, blob, msg, ok){

    }
    pinta();
  }
}

function route(){
  const h = (location.hash || '').slice(1);
  window.scrollTo(0,0);
  let sec = 'inicio';
  if (h.startsWith('juego-') && JUEGOS[h.slice(6)]) { sec = JUEGOS[h.slice(6)].ambito; juego(h.slice(6)); }
  else if (h.startsWith('tema-') && TEMAS[h.slice(5)]) { sec = TEMAS[h.slice(5)].ambito; tema(h.slice(5)); }
  else { const a = byId(h); if (a) { sec = a.id; ambito(a); } else home(); }
  document.body.dataset.amb = sec === 'inicio' ? '' : sec;
  tabbar(sec);
}
window.addEventListener('hashchange', route);
route();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}</script>
